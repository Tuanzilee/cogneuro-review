const $=s=>document.querySelector(s);
const tw=(s,fs)=>{let w=0;for(const ch of s)w+=/[⺀-鿿＀-￯　-〿]/.test(ch)?fs:fs*.58;return w};
function wrap(text,max){ // max 以「中文字寬」為單位
  if(!text) return [];
  const out=[];
  text.split('\n').forEach(par=>{let line='',w=0;for(const ch of par){const cw=/[⺀-鿿＀-￯　-〿]/.test(ch)?1:.55;if(w+cw>max){out.push(line);line='';w=0}line+=ch;w+=cw}out.push(line)});
  return out;
}
function smooth(p){let d=`M${p[0][0]},${p[0][1]}`;for(let i=0;i<p.length-1;i++){const p0=p[i-1]||p[i],p1=p[i],p2=p[i+1],p3=p[i+2]||p2;
  const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6],c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

// sh: ['e',cx,cy,rx,ry,rot] | ['s',pathD,strokeW] | ['p',points]

 // —— 後景（腦幹、小腦）
 {id:'cb',n:'小腦',en:'Cerebellum',g:'hind',back:1,sh:['e',615,368,85,38],loc:'位於後腦、枕葉下方，與腦幹後方相連',fn:'動作的精確時序、協調與誤差修正；也參與動作學習與節拍預測。受損時肌力仍在，但動作搖晃、不準。'},
 {id:'pons',n:'橋腦',en:'Pons',g:'hind',back:1,sh:['e',505,347,32,24],loc:'腦幹中段，夾在中腦與延髓之間，前方隆起',fn:'連結大腦、小腦與腦幹各系統，參與睡眠與喚醒。'},
 {id:'med',n:'延髓',en:'Medulla',g:'hind',back:1,sh:['e',510,408,24,30],loc:'腦幹最下段，接續脊髓',fn:'控制呼吸、心跳、吞嚥等維持生命的功能。'},
 // —— 皮質（lobes 另外畫）
 {id:'pfc',n:'前額葉',en:'Prefrontal cortex',g:'cog',sh:['e',215,150,50,55],loc:'額葉最前端',fn:'目標導向行為、工作記憶、決策、抑制與控制。'},
 {id:'broca',n:'Broca 區（左下額回）',en:'Broca\'s area / IFG',g:'lang',sh:['e',215,243,15,14],loc:'左側額葉下部，緊鄰外側裂（Sylvian fissure）前上方',fn:'語言產出、發音規劃、語意選擇與控制；與 Wernicke 區以弓狀束相連。'},

/* ============ 尖峰編碼 ============ */
function spikeScene(sc){
  const m=sc.mode,r=rng(11);let s=defs();
  const ticks=(y,rate,seed,xa=110,xb=740,hh=30,col='var(--cog)',times)=>{const rr=rng(seed);let o='';
    (times||Array.from({length:rate},()=>rr())).forEach(u=>{const x=xa+u*(xb-xa);o+=`<line x1="${x}" y1="${y-hh/2}" x2="${x}" y2="${y+hh/2}" style="stroke:${col};stroke-width:2.2"/>`});return o};
  if(m==='rate'){
    s+=`<rect x="110" y="40" width="630" height="440" style="fill:var(--accent);opacity:.05"/><text class="axt" x="110" y="32">刺激出現後 1 秒</text>`;
    [['弱刺激（不太符合偏好）',5,150],['強刺激（很符合偏好）',40,300]].forEach(([t,rt,y],i)=>{
      s+=`<text class="ct" x="110" y="${y-34}" style="font-weight:700">${t}　→　${rt} 次／秒</text><line class="ax" x1="110" y1="${y+16}" x2="740" y2="${y+16}"/>`+ticks(y,rt,i+3);});
    s+=noteSVG({x:425,y:420,t:'每一發的高度／波形大致相同（全有全無）\n刺激強度＝放電「頻率」，不是單發的大小'});
  }else if(m==='tuning'){
    const faces=['A','B','C','D','E'],cells=[[.2,.9,.5,.1,.15],[.7,.15,.3,.85,.2],[.1,.2,.95,.3,.6],[.05,.1,.1,.08,.12]];
    s+=`<text class="ct" x="14" y="24" style="font-weight:700">四顆下顳葉神經元，對五張臉的放電率</text>`;

      row.forEach((v,i)=>{const x=250+i*105,h=v*60;s+=`<rect x="${x-18}" y="${y0+40-h}" width="36" height="${h}" rx="4" style="fill:${v>.8?'var(--lang)':'var(--cog)'};opacity:${v>.8?1:.6}"/>`})});
    s+=noteSVG({x:400,y:500,t:'多數細胞不是只對一張臉放電，而是對「一組」臉有不同程度反應'});
  }else if(m==='sync'){
    const yA=[110,170],yB=[330,390];
    s+=`<text class="ct" x="30" y="60" style="font-weight:700">同一根光棒跨越兩個感受野</text><text class="ct" x="30" y="280" style="font-weight:700">兩根分開的光棒</text>`;
    const base=[.08,.2,.31,.44,.52,.66,.78,.9];
    yA.forEach((y,i)=>{s+=`<text class="axt" x="30" y="${y+4}">神經元 ${i?'B':'A'}</text><line class="ax" x1="110" y1="${y+16}" x2="740" y2="${y+16}"/>`+ticks(y,0,1,110,740,30,'var(--accent)',base)});
    base.forEach(u=>{const x=110+u*630;s+=`<line x1="${x}" y1="${yA[0]-18}" x2="${x}" y2="${yA[1]+18}" style="stroke:var(--accent);stroke-width:1;stroke-dasharray:3 3;opacity:.5"/>`});
    yB.forEach((y,i)=>{s+=`<text class="axt" x="30" y="${y+4}">神經元 ${i?'B':'A'}</text><line class="ax" x1="110" y1="${y+16}" x2="740" y2="${y+16}"/>`+ticks(y,0,1,110,740,30,'var(--cog)',i?[.03,.17,.27,.4,.58,.7,.83,.95]:base)});
    s+=noteSVG({x:600,y:230,t:'放電次數相同；差別在「是否同步」→ 大腦可能據此綁定為同一來源'});
  }else if(m==='pop'){
    const grids=[['祖母細胞（局部表徵）','一顆細胞＝一個概念\n有效率但脆弱，也難以證明',[12]],['完全分散','幾乎所有細胞都參與\n不夠節能',[0,1,2,3,5,6,8,9,11,12,13,15,16,18,19,21,22,23,24]],['稀疏分散式（較符合證據）','一小群細胞共同代表概念\n每顆也參與相關概念',[2,7,12,13,17]]];
    grids.forEach(([t,sub,on],g)=>{const ox=24+g*262;s+=`<g style="opacity:${!sc.hl||sc.hl.includes(g)?1:.3}"><text class="ct" x="${ox+110}" y="40" text-anchor="middle" style="font-weight:700">${t}</text>`;
      for(let i=0;i<25;i++){const cx=ox+30+(i%5)*40,cy=100+Math.floor(i/5)*40,a=on.includes(i);s+=`<circle cx="${cx}" cy="${cy}" r="13" style="fill:${a?'var(--accent)':'var(--panel)'};stroke:${a?'var(--accent)':'var(--mute)'};stroke-width:1.6"/>`}

}

  s+=g('nt',[[524,186],[527,200],[522,212],[528,222],[525,176]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3" style="fill:var(--lang)"/>`).join(''));
  s+=g('receptor',[184,200,216].map(y=>`<path d="M535,${y-6} q-8,6 0,12" fill="none" style="stroke:__S__;stroke-width:3.6"/>`).join('')+`<text class="axt" x="560" y="160">受體</text>`);

  // AP inset

  const ph={rest:[.5,-70,'靜息 −70 mV\n鈉鉀幫浦＋選擇性通透'],graded:[1.2,-64,'漸進電位\n（未達閾值）'],threshold:[1.45,-55,'達閾值 −55 mV\n→ 觸發'],spike:[1.9,40,'去極化 Na⁺流入\n→ 再極化 K⁺流出'],depol:[1.75,10,'去極化\nNa⁺ 通道開、鈉流入'],repol:[2.4,-40,'再極化\nK⁺ 外流'],hyper:[2.8,-80,'超極化＋不應期']}[sc.ap];

  s+=`<path d="${smooth(pts)}" fill="none" style="stroke:var(--aud);stroke-width:4;stroke-linecap:round;opacity:${sc.ap?1:.35}"/>`;

  if(sc.notes)sc.notes.forEach(n=>s+=noteSVG(n));
  return s;
}

 scenes:[
  S('f M R I 不是直接看神經元放電','神經元工作需要能量並耗氧；帶氧血紅素被用掉後，順磁性的去氧血紅素增加，磁場變不均勻，訊號先略降。',{hl:['n','o','d'],mark:['dip']}),
  S('身體過度補償 → BOLD 上升','神經血管耦合送來比用掉的還多的含氧血。去氧血紅素的相對比例下降，磁場變均勻，訊號反而上升。這就是 BOLD。',{hl:['f','b'],mark:['peak']}),
  S('整條曲線＝血流動力反應函數 HRF','初始小下降 → 幾秒內到高峰 → 回落並短暫低於基線 → 慢慢恢復。它比神經元的毫秒變化慢很多。',{hl:['n','o','d','f','b'],mark:['dip','peak','under']}),
  S('時間解析度：被血流限制，不是被掃描速度限制','TR 決定多久拿到一張影像，但就算掃得再快，血流自己不會變成毫秒反應。事件相關設計靠已知的 HRF＋統計模型，把重疊的慢訊號分開估計。',{hl:['b'],mark:['tr','overlap']}),
  S('時間尺度比較：想問「何時」用 EEG／ERP','f M R I 秒級；E E G、M E G 毫秒級；TMS 可操弄毫秒級的干擾時間點。',{view:'scale',axis:'time',hl:['fmri','eeg','meg','sc','tms']}),
  S('空間解析度：體素與取捨','體素是三維像素，通常達毫米級，遠優於頭皮 E E G。但體素縮小時每格訊號變少、雜訊相對變大；磁場強度、頭動與血管分布也影響實際精確度。',{view:'scale',axis:'space',hl:['fmri','eeg','meg','sc']})
 ],
 one:'神經活動先改變耗氧與血流，再形成 BOLD；體素與掃描條件決定空間細緻度，緩慢的血流反應決定時間不可能像電生理那麼快。問「哪裡」用 f M R I，問「何時」用 E E G／E R P。'});

add({n:4,orig:'4.4',g:'method',title:'腦區活躍不等於腦區必要',view:'flow',
 flow:{nodes:[
  {id:'fmri',x:140,y:70,t:'f M R I 看到 B O L D ↑',s:'某區在作業中活動變大',c:'info'},
  {id:'corr',x:400,y:70,t:'只證明「相關」',s:'活動與作業一起變化，不是移除後的因果',c:'warn',w:200},
  {id:'r1',x:100,y:190,w:150,t:'核心運算',c:'ok'},{id:'r2',x:290,y:190,w:150,t:'注意／喚醒',c:'gray'},{id:'r3',x:480,y:190,w:150,t:'抑制／監控',c:'gray'},{id:'r4',x:690,y:190,w:170,t:'非必要的策略',c:'gray'},
  {id:'les',x:140,y:320,t:'自然損傷 / T M S',s:'讓該區失效',c:'pur'},
  {id:'nec',x:400,y:320,t:'作業選擇性變差？',s:'是 → 才支持「必要」',c:'ok',w:200},
  {id:'mis1',x:240,y:450,w:230,t:'造影有活動、損傷無影響',s:'策略不同／代償／一般性注意',c:'bad'},
  {id:'mis2',x:570,y:450,w:230,t:'造影無差異、損傷有缺損',s:'共同基線被相減／傷到白質連線',c:'bad'}],
  edges:[['fmri','corr'],['corr','r1','可能是'],['corr','r2'],['corr','r3'],['corr','r4'],['les','nec'],['corr','nec','✕ 不能直接推',1],['nec','mis1','不一致時'],['nec','mis2']]},
 scenes:[
  S('造影看到的是「一起活動」','B O L D 上升只表示活動與作業條件一起變化。就像看到後廚的廚師、洗碗員、警報器都在運作，不能只憑它們在運作就說少了誰都做不出那道菜。',{hl:['fmri','corr']}),
  S('活躍的原因可能有很多種','可能是核心運算，也可能是注意力、抑制、監控，甚至是受試者採用的非必要策略。難的作業還會帶動一般性注意與工作記憶網路。',{hl:['corr','r1','r2','r3','r4']}),
  S('要證明必要：看失效後作業是否選擇性變差','「必要」＝沒有它就做不到；「充分」＝有它就足以造成。單靠活化兩者都不能直接證明；要用自然損傷或 T M S 這類因果操弄。',{hl:['les','nec','corr']}),
  S('不一致時最有價值','造影有活動但損傷後功能仍在 → 查策略與代償；造影沒差異但損傷有缺損 → 查基線相減、區域太小、或白質連線被破壞。不是誰錯，而是追問作業、控制條件、策略與網路連結哪裡不同。',{hl:['nec','mis1','mis2']})
 ],
 one:'活躍只表示相關；要證明某腦區對功能是必要的，必須用自然損傷、T M S 或其他因果操弄，看讓它失效後功能是否下降。'});

add({n:5,orig:'5.1',g:'method',title:'從腦傷成人推論正常認知的三個假設',view:'flow',
 flow:{nodes:[
  {id:'pat',x:400,y:50,w:300,t:'從腦傷病人的缺損型態，逆推正常認知的零件',c:'info'},
  {id:'a1',x:130,y:170,w:220,t:'① 區分性假設',s:'認知成分可被選擇性破壞（成分＝運算，不一定是整齊小腦區）',c:'pur'},
  {id:'a2',x:400,y:170,w:220,t:'② 透明性假設',s:'受損後仍是「正常系統少一塊」，沒有重新發明新架構',c:'pur'},
  {id:'a3',x:670,y:170,w:220,t:'③ 普遍性假設',s:'人與人的核心架構足夠相似',c:'pur'},
  {id:'ss',x:200,y:320,w:260,t:'單一分離：A 差、B 正常',s:'陷阱：可能只是 A 比較難（作業資源假象）或附帶要求較多',c:'warn'},
  {id:'ds',x:600,y:320,w:260,t:'雙重分離：病人 1 A差B好；病人 2 A好B差',s:'難以再用難度解釋 → 至少部分依賴不同機制',c:'ok'},
  {id:'ctl',x:400,y:450,w:380,t:'仍須檢查：作業純度、錯誤型態、病灶範圍、多項作業與群體證據',c:'gray'}],
  edges:[['pat','a1'],['pat','a2'],['pat','a3'],['a1','ss'],['ss','ds','加強'],['ds','ctl'],['a2','ctl'],['a3','ctl']]},
 scenes:[
  S('① 區分性：缺損可以是選擇性的','若所有功能永遠一起壞，就無法從缺損型態推論有哪些零件。臨床上確實看得到選擇性缺損，所以大致合理；但真實病灶很少像拔掉一顆積木那麼乾淨。',{hl:['pat','a1']}),
  S('② 透明性：最有爭議','大腦有可塑性，也會發展代償策略。成人後天腦傷、表現穩定、恢復歷程清楚時，比兒童早期腦傷更安全。',{hl:['pat','a2']}),
  S('③ 普遍性：個案能提出強反例，但不能自動代表所有人','不是說每個人大腦一樣，而是核心處理架構可比較。個別差異確實存在。',{hl:['pat','a3']}),
  S('單一分離 vs 雙重分離','單一分離可能只是難度差；雙重分離（如母音 vs 子音處理的互補個案）更難用難度解釋。',{hl:['a1','ss','ds']}),
  S('最後仍要多方交叉','雙重分離也不等於兩個完全獨立的盒子。需要多作業、錯誤分析、病灶資料和群體證據一起加強結論。',{hl:['ds','ctl','a2','a3']})
 ],
 one:'腦傷推論依賴區分性、透明性與普遍性；三者都有一定合理性，也都有現實限制，因此要用雙重分離、多項作業和群體證據一起加強結論。'});

add({n:6,orig:'5.3',g:'method',title:'單一個案推論正常認知的優點與缺點',view:'flow',
 flow:{nodes:[
  {id:'h1',x:200,y:40,w:240,t:'單一個案',c:'info'},{id:'h2',x:600,y:40,w:240,t:'團體研究',c:'ok'},
  {id:'p1',x:200,y:120,w:260,t:'保留完整缺損型態',c:'info'},
  {id:'p2',x:200,y:190,w:260,t:'細緻錯誤分析',s:'錯的是母音還是子音？熟悉臉還是陌生臉？',c:'info'},
  {id:'p3',x:200,y:275,w:260,t:'可與互補個案形成雙重分離',c:'info'},
  {id:'c1',x:200,y:365,w:260,t:'缺點',s:'普遍性有限、依賴透明性與普遍性、單一分離可能是難度、病灶不規則',c:'bad'},
  {id:'avg',x:400,y:235,w:130,t:'平均陷阱',s:'5人聽懂說不出＋5人說得出聽不懂＝平均「都中度受損」',c:'warn'},
  {id:'g1',x:600,y:140,w:260,t:'統計穩定、可找共同病灶',c:'ok'},
  {id:'g2',x:600,y:230,w:260,t:'估計病灶與缺損的關聯',c:'ok'},
  {id:'c2',x:600,y:340,w:260,t:'缺點',s:'平均掉個別差異；互補分離消失',c:'bad'},
  {id:'mix',x:400,y:455,w:420,t:'互補：個案提出精細模型 → 群體與其他方法檢驗',c:'pur'}],
  edges:[['h1','p1'],['p1','p2'],['p2','p3'],['p3','c1'],['h2','g1'],['g1','g2'],['g2','c2'],['c2','avg'],['c1','mix'],['c2','mix']]},
 scenes:[
  S('個案優點：保留一個人的完整型態與細緻錯誤','平均會把互補的分離抹掉；深入個案才能看出功能不是平均變弱，而是某些零件壞、某些保留。',{hl:['h1','p1','p2','p3']}),
  S('個案缺點：普遍性與假設','一人的病前能力、病灶、恢復與策略都獨特；也依賴上一題的三個假設；自然腦傷常同時傷灰質、白質和遠端網路。',{hl:['h1','c1']}),
  S('團體研究：統計穩定性與共同病灶','很多具相同缺損的人若有共同損傷位置，對病灶—功能關聯更有信心。',{hl:['h2','g1','g2']}),
  S('平均陷阱','10 位病人中 5 位聽得懂說不出、5 位說得出聽不懂；直接平均會變成「說和聽都中度受損」，互補分離消失。',{hl:['avg','c2','h2']}),
  S('兩者不是競爭，而是互補','單一個案最擅長問「功能如何拆分」，團體研究最擅長問「缺損與哪些病灶穩定相關」。',{hl:['mix','c1','c2']})
 ],
 one:'單一個案最擅長問功能如何拆分，團體研究最擅長問缺損與哪些病灶穩定相關；最好的結論是讓個案提出精細模型，再用更多個案、團體與其他方法檢驗。'});

add({n:7,orig:'5.5',g:'method',title:'自然腦傷與 T M S／t E S 的比較',view:'brain',legend:[],
 scenes:[
  S('共同邏輯：讓某區不能工作，再看作業是否變差','造影是看「一起活動」，損傷法才能回答「必要」與因果。三種方法差在損傷是永久的、暫時干擾，還是改變興奮性。',{hl:['v1','v23']}),
  S('自然腦傷：大、真實，但不可控','病灶常跨多區、形狀不規則、可能破壞白質連線；病人病前能力、恢復時間、代償程度不同，且長期損傷會重組（透明性問題）。',{extra:L(520,200,70,48,-10),hl:['ppc','psts','wern','pbelt'],notes:[{x:300,y:100,t:'不規則、跨區、傷到白質\n長期會重組',to:[470,185]}]}),
  S('T M S：磁場在皮質誘發電流，暫時干擾','可逆、可控；同一個人可比較刺激 vs 控制；還能改變刺激時點，問某區在 80 ms 或 200 ms 是否必要（空間＋時間因果）。限制：主要影響表淺皮質、聚焦有限、效應通常小於真實腦傷。',{extra:COIL(752,190),hl:['v1','v23'],notes:[{x:700,y:340,t:'「虛擬損傷」＝暫時干擾\n不是完全關掉',a:'middle'}]}),
  S('盲人點字：TMS 把「亮起來」變成「必要」','造影看到早盲者讀點字時枕葉活躍（可能只是伴隨）；用 TMS 干擾盲人中枕葉後點字真的變差，戴眼罩明眼人則影響不大 → 視覺皮質已被徵用為觸覺辨識所必要。',{extra:COIL(752,190),hl:['v23','v1','s1'],notes:[{x:300,y:60,t:'早盲者：枕葉＋體感覺區一起工作',to:[430,130]}]}),
  S('t E S（如 t D C S）：弱電流偏壓興奮性','陽極傾向提高、陰極傾向降低興奮性（簡化口訣；實際依腦區、任務、方向與當下狀態而變）。空間較粗、不適合當短暫損傷，但可用較長時間刺激來研究學習與刺激結束後的後效。',{extra:TDCS,hl:['pfc','ppc']})
 ],
 one:'自然腦傷效應大、真實但不可控且會重組；T M S 短暫、可控，適合檢驗某區在何時必要；t E S 更像調高或調低網路的興奮傾向。三者互補，沒有一種能完整取代其他方法。'});

add({n:8,orig:'4.2',g:'method',title:'功能造影的認知減法與問題',view:'flow',
 flow:{nodes:[
  {id:'ea',x:130,y:60,w:200,t:'實驗作業',s:'基本視覺＋詞形／詞彙處理（看字）',c:'info'},
  {id:'cb',x:130,y:165,w:200,t:'控制作業',s:'只有基本視覺（看簡單符號）',c:'gray'},
  {id:'sub',x:400,y:110,w:150,t:'相減',s:'共同部分抵銷',c:'warn'},
  {id:'res',x:660,y:110,w:210,t:'剩下的差異',s:'解讀為「額外成分」的活動',c:'ok'},
  {id:'pi',x:130,y:290,w:210,t:'問題 1：純插入假設',s:'加入新成分時其他歷程真的完全不變嗎？',c:'bad'},
  {id:'bl',x:400,y:290,w:210,t:'問題 2：基線選擇',s:'太簡單→多出難度；太相似→相減後消失',c:'bad'},
  {id:'ex',x:660,y:290,w:210,t:'例：朗讀 − 看字',s:'＝發音＋動作規劃＋聽自己＋錯誤監控，非單一功能',c:'warn'},
  {id:'f1',x:130,y:430,w:200,t:'因子設計',s:'看交互作用，不必假設成分互不影響',c:'pur'},
  {id:'f2',x:400,y:430,w:200,t:'認知聯集',s:'多個對比共同出現的區域',c:'pur'},
  {id:'f3',x:660,y:430,w:200,t:'參數設計',s:'連續改變負荷，看活動是否規律變化',c:'pur'}],
  edges:[['ea','sub'],['cb','sub'],['sub','res'],['res','pi'],['res','bl'],['bl','ex'],['pi','f1'],['bl','f2'],['bl','f3']]},
 scenes:[
  S('為什麼一定要比較條件','即使只看一個字，腦中同時有視覺、注意、辨字、理解、準備反應。只看單一條件無法知道某片活動對應哪一環。',{hl:['ea']}),
  S('認知減法：實驗作業 − 控制作業','兩個作業盡量相似、只差一個想研究的成分；共有部分抵銷，剩下差異被解讀為該成分。像兩份食譜只差辣椒。源自 Donders 的反應時間減法。',{hl:['ea','cb','sub','res']}),
  S('問題一：純插入假設','假定新成分放入時其他歷程完全照舊。但看字時的注意方式、眼動與視覺分析，可能一開始就和看符號不同。',{hl:['res','pi']}),
  S('問題二：基線選擇','控制太簡單會混進難度、注意與反應差異；太相似又可能把想研究的成分也消掉。',{hl:['res','bl','ex']}),
  S('補救：因子、聯集、參數設計','交互作用可直接檢驗一因素是否改變另一因素的效果；聯集降低單一基線的偶然；參數設計讓自變項連續變化。',{hl:['pi','bl','f1','f2','f3']})
 ],
 one:'認知減法把實驗作業減去控制作業，想留下額外認知成分；弱點是純插入常不成立、結果高度依賴基線，因此需要因子、聯集與參數設計補強。'});

add({n:9,orig:'4.3',g:'method',title:'功能造影不會完全取代損傷法',view:'flow',
 flow:{nodes:[
  {id:'fm',x:140,y:60,w:220,t:'功能造影',s:'正常人・全腦・「相關」',c:'info'},
  {id:'ls',x:660,y:60,w:220,t:'損傷法（病灶／T M S）',s:'選擇性失敗・「必要性」因果',c:'pur'},
  {id:'fl',x:140,y:170,w:240,t:'限制',s:'活躍≠必要；沒亮也可能被基線相減、訊號弱、個體對不齊',c:'bad'},
  {id:'ll',x:660,y:170,w:240,t:'限制',s:'病灶大而不規則、破壞連線、遠距效應、長期重組、策略不同',c:'bad'},
  {id:'mm',x:400,y:170,w:150,t:'兩者不一致',s:'最有價值',c:'warn'},
  {id:'c1',x:140,y:310,w:220,t:'造影提出候選區／網路',c:'info'},
  {id:'c2',x:400,y:310,w:210,t:'損傷／T M S 檢驗必要性',c:'pur'},
  {id:'c3',x:660,y:310,w:230,t:'病人的選擇性缺損 → 告訴造影該比較哪些成分',c:'pur'},
  {id:'ch',x:400,y:440,w:420,t:'證據鏈：交叉驗證，建立可靠的認知神經科學理論',c:'ok'}],
  edges:[['fm','fl'],['ls','ll'],['fl','mm'],['ll','mm'],['c1','c2'],['c2','c3'],['c3','c1',''],['c2','ch'],['mm','ch']]},
 scenes:[
  S('兩種方法回答不同的問題','造影：正常人在作業中哪些區域一起活動；損傷法：系統不能工作後功能是否選擇性失敗。',{hl:['fm','ls']}),
  S('各有各的限制','造影多是相關；損傷法的雜訊來自大而不規則的病灶、連線破壞、重組與策略。',{hl:['fm','fl','ls','ll']}),
  S('不一致反而最有價值','迫使理論把任務拆更細：是非必要策略、代償、基線相減，還是連線被破壞？',{hl:['fl','ll','mm']}),
  S('互相幫忙形成證據鏈','造影提候選區 → 損傷／T M S 驗證必要性 → 結構影像描病灶 → 病人缺損告訴造影該比較什麼。',{hl:['c1','c2','c3','ch']})
 ],
 one:'結論不是誰比較高級，而是證據鏈：造影告訴你正常系統在哪些地方一起活動，損傷法告訴你失去哪些部分會讓功能失敗；兩者必須交叉驗證。'});

add({n:10,orig:'7.1',g:'sense',title:'盲視與它對正常視覺的啟示',view:'brain',legend:['vis'],
 scenes:[
  S('皮質盲：V1 受損 → 對應視野沒有有意識的視覺','V1 受損可造成半邊、四分之一或一小塊視野缺損；主要路徑「視網膜→LGN→V1」中斷。',{extra:L(680,190,24,46),hl:['eye','lgn','v1'],paths:['retina_lgn','lgn_v1'],blocked:['lgn_v1'],notes:[{x:560,y:80,t:'V1 損傷（皮質盲）',to:[672,170]}]}),
  S('盲視：說「什麼都沒看到」，但被迫猜時高於機率','刺激在盲區閃一條斜線，病人說「左邊是黑的」；被迫二選一（方向、位置、動作）卻長期高於 50%，眼或手也會朝刺激移動。重點是大量試次後可靠高於機率，同時缺乏主觀看見。',{extra:L(680,190,24,46),hl:['v1'],notes:[{x:300,y:110,t:'病人：「我什麼都沒看到」'},{x:300,y:150,t:'被迫猜 → 表現 > 50%（可靠、重複）'}]}),
  S('旁路一：視網膜 → 上丘 → 視丘枕核 → MT／外紋狀皮質','V1 之外還有舊的皮質下視覺路徑，支援快速定向、定位與動作偵測。',{extra:L(680,190,24,46),hl:['eye','sc','pulv','mt'],paths:['retina_sc','sc_pulv','pulv_mt']}),
  S('旁路二：LGN 部分細胞群 → MT／V5','特別有助於快速定位與動作偵測，不經過 V1。',{extra:L(680,190,24,46),hl:['lgn','mt'],paths:['lgn_mt']}),
  S('啟示（以及不要過度簡化）','①視覺是多條平行路徑 ②處理資訊與意識到資訊可分離 ③V1 對有意識、精細、可報告的視覺非常重要。盲視辨別通常粗糙、受限、不穩定，不是「正常視覺只少了意識」。研究者還要排除 V1 殘存與光散射。',{hl:['v1','sc','mt','ppc'],paths:['retina_sc','pulv_mt','lgn_mt']})
 ],
 one:'盲視顯示受損而無意識的視覺處理仍可能存在，因此視覺辨別與主觀視覺意識不是完全相同的東西。'});

add({n:11,orig:'7.2',g:'sense',title:'V1 對視知覺在多大程度上是必要的',view:'brain',legend:['vis'],
 scenes:[
  S('先問：是哪一種視覺？','視知覺不是單一能力：有意識地看見、精細辨認，或只是粗略定位與動作反應，答案不同。',{hl:['v1']}),
  S('對有意識、精細的視覺：V1 幾乎是必要條件','V1 保留視網膜拓樸並分析邊緣、方向、明暗與波長；顏色、形狀、動作、物體都建立在這些早期分析上。V1 與高階區的迴返互動也與意識經驗密切相關。',{hl:['eye','lgn','v1','v23','v4','mt','it'],paths:['retina_lgn','lgn_v1','v1_v4','v1_mt']}),
  S('對粗略定位／定向：V1 不是唯一入口','經上丘、枕核或 LGN 旁路到外紋狀皮質，可支援快速定向、眼動與粗略動作偵測，但精細度與意識感較差。',{hl:['sc','pulv','mt','lgn'],paths:['retina_sc','sc_pulv','pulv_mt','lgn_mt']}),
  S('必要 ≠ 充分','V1 完好只完成早期分析；認顏色要 V4、看動作要 MT、認物體臉要下顳葉，還需要注意與記憶系統。',{hl:['v1','v4','mt','it','ppc','pfc'],paths:['v1_v4','v4_it','v1_mt','mt_ppc']})
 ],
 one:'對有意識的視覺經驗與精細辨認，V1 幾乎是必要條件；對粗略定位、定向與部分動作處理，V1 不是唯一必要路徑；對完整視知覺，V1 又不是充分條件。'});

add({n:12,orig:'7.3',g:'sense',title:'顏色恆常與物體恆常',view:'brain',legend:['vis','par'],
 scenes:[
  S('為什麼恆常性是問題','光源變 → 反射波長變；走近走遠 → 影像大小變；換角度 → 視網膜形狀變。大腦要從變動影像推論相對穩定的物體。',{hl:['v1'],notes:[{x:560,y:90,t:'光源／距離／視角一直變',a:'middle'}]}),
  S('顏色恆常：V1 看局部波長，V4 看場景脈絡','V1 對局部波長與明暗敏感，光源變它也變；V4 與腹側系統整合較大範圍脈絡，像相機自動白平衡，先估計光源再修正表面顏色。V4 受損可致大腦性色盲（看世界近灰階，形狀、深度仍保留）。',{hl:['v1','v4'],paths:['v1_v4'],notes:[{x:560,y:372,t:'V4：顏色相對不受照明改變'},{x:560,y:340,t:'V1：隨光源改變'}]}),
  S('物體恆常：腹側路徑往下顳葉','V4 → 梭狀回 → IT。IT 神經元感受野大，不太在意位置與大小，更在意「是什麼」，適合建立跨位置、跨大小的物體身分。',{hl:['v4','ffa','it'],paths:['v1_v4','v4_it']}),
  S('兩套表徵：身分 vs 視角','左側下顳葉／梭狀回常把不同大小與角度視為同一物體；右半球與頂葉網路對視角、空間方向更敏感。病人可能認得物體卻判斷不出方向，或只在熟悉視角認得。',{hl:['it','ffa','ppc'],paths:['v4_it','mt_ppc'],notes:[{x:300,y:370,t:'跨視角：「同一個物體」'},{x:560,y:60,t:'保留視角、方向資訊'}]}),
  S('f M R I 適應：用「降低」檢驗相同表徵','重複同一表徵 → 反應降低。物體換角度後某區仍降低＝該區把不同視角當成同一身分；反應恢復＝該區仍區分視角。',{hl:['it','ffa'],notes:[{x:300,y:370,t:'換角度後仍降低 → 同一身分\n換角度後恢復 → 區分視角'}]})
 ],
 one:'顏色恆常靠比較局部與場景脈絡來估計表面顏色；物體恆常靠把變動影像轉成較穩定的結構與身分表徵，同時由另一部分系統保留視角和方向資訊。'});

add({n:13,orig:'8.6',g:'sense',title:'語音知覺中的動作成分',view:'brain',legend:['aud','vis','mot'],
 scenes:[
  S('語音為什麼難：協同發音','說話時嘴巴在發前一個音就已準備下一個音，同一音素在不同前後文聲學訊號會變，不同訊號也可能被聽成同一音素。',{hl:['a1','stg'],paths:['mgn_a1'],notes:[{x:300,y:215,t:'聲學訊號高度變動',to:[393,254]}]}),
  S('動作理論：聽者反推「說話者做了什麼發音動作」','自己的大腦知道舌、唇、聲帶怎麼產生聲音，可用運動表徵反推別人的發音。不等於你真的動嘴複誦，而是發音系統提供預測。',{hl:['a1','wern','broca','pmc'],paths:['arcuate','psts_pmc']}),
  S('McGurk：看到的嘴型改變聽到的音','看 ga、聽 ba → 常聽成 da；閉眼錯覺消失。pSTS 是重要多感官整合區。但這直接證明的是視聽整合，不單獨證明語音一定要靠運動系統。',{hl:['v1','psts','a1','pmc'],paths:['v1_psts','a1_psts','psts_pmc'],notes:[{x:640,y:340,t:'看 ga ＋ 聽 ba → 知覺 da'}]}),
  S('類別知覺＋TMS：訊號模糊時運動區才派上用場','da/ta 的聲帶振動時間連續變化，知覺卻在界線前後切成兩類。TMS 干擾前運動／發音區，語音清楚時影響小，介於兩音之間或有雜訊時辨別變差。',{extra:`<g><rect x="640" y="6" width="150" height="84" rx="8" style="fill:var(--panel);stroke:var(--line)"/><path d="M652,80 C700,80 700,24 780,24" fill="none" style="stroke:var(--aud);stroke-width:3"/><text x="715" y="100" class="axt" text-anchor="middle">VOT 連續變化 →</text><text x="660" y="22" class="axt">ta</text><text x="752" y="76" class="axt">da</text></g>`,hl:['a1','pmc','broca'],paths:['psts_pmc']}),
  S('強版本不成立','若發音運動區是語音知覺唯一基礎，這些區域受損者應幾乎聽不懂語音；實際上多半只在困難條件出現輕微障礙。運動表徵是輔助預測器。',{hl:['a1','stg','pmc','psts']})
 ],
 one:'語音知覺主要依賴聽覺與多感官系統，運動表徵在訊號模糊或需要學習時提供預測與輔助，但不是唯一必要機制。'});

add({n:14,orig:'3.1',g:'method',title:'大腦電訊號與電生理技術',view:'neuron',legend:[],
 scenes:[
  S('漸進電位（突觸後電位）：樹突與細胞體','可興奮也可抑制；強度可變、隨距離衰減；神經元把不同位置、不同時間的輸入加總。',{hl:['inputs','dendrite','soma'],ap:'graded'}),
  S('動作電位：軸突起始處過閾值才觸發','全有全無，沿軸突靠電壓閘控離子通道再生，不衰減。刺激強時不是波形變大，而是頻率變高。',{hl:['hillock','axon','node'],ap:'spike'}),
  S('E E G／E R P：大量、同步、方向平行的突觸後電位','單顆細胞電場太小且方向雜亂會互相抵銷；只有許多平行的錐體細胞同時活動，電場才傳到頭皮。時間解析度毫秒級，但來源定位差（逆問題）。',{view:'brain',extra:EEG_EXTRA,notes:[{x:260,y:140,t:'頭皮電極：量到的是\n大量同步的突觸後電位',to:[335,76]}]}),
  S('單一細胞記錄：直接數動作電位','細電極放在神經元內或附近，以每秒放電次數分析；能精確問某顆細胞偏好什麼，但具侵入性，多用於動物或少數手術情境。',{view:'brain',extra:`<line x1="338" y1="0" x2="340" y2="318" style="stroke:var(--ink);stroke-width:2.4"/><circle cx="340" cy="320" r="4" style="fill:var(--accent)"/>`,hl:['it'],notes:[{x:200,y:70,t:'微電極 → 單一神經元',to:[339,200]}]}),
  S('MEG：量神經電流造成的磁場','磁場較不受頭皮與顱骨扭曲，定位通常優於 E E G，毫秒級；設備昂貴需磁屏蔽，對方向與深度有條件。',{view:'brain',extra:`<path d="M95,180 C95,20 760,10 760,200" fill="none" style="stroke:var(--par);stroke-width:3;stroke-dasharray:8 6"/><circle cx="130" cy="86" r="7" class="sensor"/><circle cx="270" cy="30" r="7" class="sensor"/><circle cx="440" cy="16" r="7" class="sensor"/><circle cx="610" cy="40" r="7" class="sensor"/>`,notes:[{x:420,y:130,t:'磁感測器環繞頭部（不貼頭皮）'}]}),
  S('依問題配工具','動作電位→單細胞；大量同步突觸後電位→E E G／E R P；伴隨磁場→M E G。電生理擅長「何時」，f M R I 擅長「哪裡」。',{view:'scale',axis:'time',hl:['sc','eeg','meg','fmri']})
 ],
 one:'先分訊號，再配工具：動作電位適合單一細胞記錄；大量同步突觸後電位形成 E E G 與 E R P；相同神經電流伴隨的磁場形成 M E G。'});

add({n:15,orig:'3.3',g:'method',title:'E R P 與認知理論的檢驗',view:'erp',legend:[],
 scenes:[
  S('單次試驗幾乎被背景 EEG 淹沒','E E G 同時混有感覺、注意、思考、眨眼與許多與刺激無關的活動。',{view:'erpavg',n:1}),
  S('刺激鎖定＋平均 → E R P','把每次刺激時刻設為零點，切出前後一小段，多次對齊平均：與刺激鎖定的反應保留，隨機背景正負抵銷。',{view:'erpavg',n:40}),
  S('怎麼讀波形','橫軸＝刺激後毫秒，縱軸＝電位。P＝正向峰、N＝負向峰，數字約是出現時間（N170、P300）。正負只是頭皮電位方向，不等於興奮／抑制或好壞。',{show:['obj','face'],pk:[[100,4,'P1',-30,-30],[170,-7,'N170（臉更大）',-90,34],[350,3.5,'P300',60,-34]]}),
  S('用時間窗檢驗理論：早 vs 晚','操弄一個因素，看哪個時間窗的振幅、潛時或頭皮分布改變。<150 ms 多半是知覺處理；>300 ms 較可能是辨認、記憶、決策。',{show:['obj','face'],wins:[[130,200,'N170：早期臉結構編碼','#d6338a'],[300,500,'晚期：辨認／記憶／決策','#7c4dd6']]}),
  S('例：聯想促發的歸屬','只看反應時間，促發與刺激清晰度的交互作用會讓人以為促發改變早期知覺。若清晰度在 150 ms 內影響波形、促發卻到 300 ms 後才出現，就能把兩個歷程分開並修正理論。',{show:['obj','face','fam'],wins:[[100,200,'刺激清晰度（早）','#2f6fe0'],[300,500,'促發（晚）','#7c4dd6']]}),
  S('限制','①峰是許多神經來源相加，一個峰≠一個純粹心理模組 ②空間定位差（逆問題）③需要許多試次，眼動眨眼說話會造成雜訊。',{show:['obj','face','fam','cari']})
 ],
 one:'E R P 透過刺激鎖定平均，從 E E G 抽出毫秒級反應；用成分出現的時間與對操弄的敏感度檢驗認知歷程，但成分不是心理功能的直接標籤，來源仍需其他方法確認。'});

add({n:16,orig:'3.4',g:'sense',title:'電生理對臉的表徵與處理的貢獻',view:'brain',legend:['vis','lim','lang'],
 scenes:[
  S('臉辨識的三層','知覺編碼（眼鼻口配置）→ 臉身分辨識（跨光線、表情、角度）→ 人物身分與知識（也可由名字、聲音觸發）。',{hl:['v23','ffa','it','atl'],paths:['v1_v4','v4_it']}),
  S('單一細胞：臉細胞多半不是祖母細胞','猴子下顳葉有對臉比物體反應強的神經元，但多數是對「一組」臉有不同程度反應。',{view:'spike',mode:'tuning'}),
  S('人類手術記錄與稀疏編碼','內側顳葉某些神經元對特定名人（不論照片或名字）高度敏感，但不可能測遍所有刺激；較穩妥解釋是稀疏編碼——一小群細胞共同代表一個概念。上顳溝細胞還對視線、表情敏感。',{hl:['hip','amy','psts','it'],notes:[{x:300,y:360,t:'內側顳葉：名人／概念細胞',to:[330,306]},{x:600,y:330,t:'STS：視線、表情',to:[545,265]}]}),
  S('E R P：N170 早期臉結構編碼','約 170 ms，對臉與臉狀結構大於物體，右後顳區較大；不太在意是不是名人，較像回答「這是臉」。',{view:'erp',show:['obj','face'],wins:[[130,200,'N170','#d6338a']]}),
  S('N250：熟悉臉／身分；晚期：人物知識','N250 對熟悉臉及同一人物不同照片較敏感；300 ms 後的成分可同時被臉和名字影響，較接近跨感官的人物知識。',{view:'erp',show:['face','fam'],wins:[[230,300,'N250 身分','#7c4dd6'],[300,500,'人物知識（臉＋名字）','#e08a0b']]}),
  S('時間資訊能裁決理論：漫畫臉','漫畫臉若在 N170 就增強，表示效果出現在知覺編碼階段，較支持「放大了視覺上有辨識力的特徵」，而不是記憶裡本來就存著一張漫畫版。',{view:'erp',show:['face','cari'],wins:[[130,200,'N170 已增強','#e08a0b']]})
 ],
 one:'單一細胞告訴我們臉與人物概念可能如何被選擇性且稀疏地編碼；E R P 告訴我們知覺編碼、臉身分和人物知識大致在什麼時間依序出現。'});

add({n:17,orig:'5.4',g:'method',title:'T M S 與 t D C S 對大腦可塑性的貢獻',view:'brain',legend:[],
 scenes:[
  S('可塑性：功能、連線與興奮性會隨經驗改變','經驗、練習、感覺缺失或損傷，會改變哪些區域參與哪些功能。造影只能看到重組後哪裡活躍，不能單獨證明新活躍區真的有功能。',{hl:['s1','v1','v23']}),
  S('早盲者讀點字：枕葉也亮了','一般人用指尖辨認凸字主要靠體感覺皮質；早盲者的視覺皮質也活躍。但這可能只是想像或伴隨現象。',{hl:['s1','v23','v1'],notes:[{x:580,y:70,t:'點字觸覺 → 體感覺區',to:[477,150]},{x:600,y:340,t:'枕葉視覺皮質也活躍？',to:[655,230]}]}),
  S('TMS 提供因果證據','干擾早盲者中枕葉 → 點字／凸字辨識下降；對戴眼罩明眼人影響較小 → 原本處理視覺的皮質已被徵用為精細觸覺所必要。',{extra:COIL(752,190),hl:['v23','v1']}),
  S('地圖會隨使用與輸入競爭而改變','長期使用某身體部位 → 對應體感覺／動作代表區擴大；截肢或缺乏輸入 → 縮小或被鄰近功能侵入。重組也受原有連線與計算特性限制（如點字與視覺都需高精度空間模式）。',{hl:['s1','m1'],notes:[{x:560,y:100,t:'代表區可擴大／縮小／被侵入',to:[455,140]}]}),
  S('t D C S：偏壓興奮性，研究後效與學習','刺激視覺皮質若使早期視覺 E R P 或微弱刺激偵測系統性改變 → 改變皮質狀態會改變知覺。停止刺激後仍持續的後效可能與突觸可塑性有關。',{extra:TDCS,hl:['v1','v23']}),
  S('限制','T M S 主要刺激表淺皮質、網路效應難完全確定；t D C S 更不聚焦，陽／陰極效果依情境改變；效應通常小於自然腦傷。',{hl:[]})
 ],
 one:'造影指出可塑性可能發生在哪裡，T M S 檢驗重組區是否已成為必要節點，t D C S 則用興奮性與後效研究可塑性如何被調整。'});

add({n:18,orig:'1.1',g:'theory',title:'心身問題與三種解決框架',view:'flow',
 flow:{nodes:[
  {id:'pr',x:400,y:50,w:360,t:'心身（心腦）問題',s:'疼痛、顏色、思想、自我感 vs 由神經元、離子、血流組成的物質大腦',c:'warn'},
  {id:'du',x:130,y:180,w:230,t:'二元論（笛卡兒）',s:'心與身是兩種實體；交會點在松果體',c:'pur'},
  {id:'as',x:400,y:180,w:230,t:'雙重面向論（斯賓諾莎）',s:'同一實在的兩種描述角度',c:'info'},
  {id:'mo',x:670,y:180,w:230,t:'一元論（物理一元論）',s:'心智由大腦產生，沒有獨立的非物質心靈',c:'ok'},
  {id:'dp',x:130,y:310,w:230,t:'難題',s:'非物質心靈如何推動神經元？又如何被實驗測量？',c:'bad'},
  {id:'ex',x:400,y:310,w:230,t:'例：同一首歌',s:'聲波頻譜與旋律情緒，兩種描述都指向同一事件',c:'info'},
  {id:'re',x:670,y:310,w:230,t:'化約論（較強版本）',s:'心理概念可能被神經生物概念取代，如燃素被氧化理論淘汰',c:'ok'},
  {id:'no',x:400,y:440,w:480,t:'現階段立場：偏一元論，但心理層次的說明仍不可少',s:'不懂什麼叫工作記憶或抑制，就無法設計有意義的神經實驗',c:'gray'}],
  edges:[['pr','du'],['pr','as'],['pr','mo'],['du','dp'],['as','ex'],['mo','re'],['dp','no'],['ex','no'],['re','no']]},
 scenes:[
  S('問題是什麼','主觀心智與物質大腦到底是兩種東西，還是同一件事的不同描述。因為現代討論集中在大腦，稱「心腦問題」更精確。',{hl:['pr']}),
  S('二元論：兩種實體','符合直覺，但給認知神經科學一個大難題：非物質心靈如何影響且被測量？所以認知神經科學通常不採取。',{hl:['pr','du','dp']}),
  S('雙重面向論：同一實在，兩種描述','外部描述神經元放電、第一人稱描述「我在害怕」，指向同一事件。就像頻譜沒有否定旋律，旋律也不是另一個漂浮的實體。',{hl:['pr','as','ex']}),
  S('一元論與化約論','物理一元論認為心智活動由物質大腦產生；化約論更強，預期心理概念終將被生物概念取代。',{hl:['pr','mo','re']}),
  S('這門課的立場','基本偏一元論：研究大腦能幫助理解心智；但一元論不等於現在就能把心理概念刪掉。',{hl:['re','ex','no']})
 ],
 one:'二元論視心身為兩種實體；雙重面向論視為同一實在的兩種描述；一元論認為心智來自大腦，化約論更預測心理概念終將被生物概念取代，而目前認知神經科學仍需要心理層次的理論。'});

  edges:[['ph','ok'],['ph','no'],['cn','me'],['cn','th'],['ok','md'],['me','md'],['no','rk'],['th','rk'],['md','rk']]},

  S('顱相學的兩個主張','①不同腦區負責不同能力 ②能力越發達腦區越大，會頂出頭骨形狀，所以摸頭可判斷人格。',{hl:['ph']}),
  S('哪個對、哪個錯','第一個含有功能專門化的早期直覺（後來的損傷、電刺激與造影確實支持區域差異）；第二個沒有可靠根據，且能力清單是憑空貼標籤。',{hl:['ph','ok','no']}),
  S('現代方法的差別','交叉驗證、控制條件、統計與重複性；更重要的是先有認知理論，把能力拆成可操作歷程。',{hl:['cn','me','th']}),
  S('定位論 vs 分散論不必二選一','基本感覺與動作有相對清楚的地圖與專門化；語言、記憶、推理、情緒依賴跨區網路。',{hl:['ok','me','md']}),
  S('風險仍在','若只問「哪裡亮」，不問作業中的計算、網路互動與替代解釋，就會變成新的顱相學。',{hl:['md','th','no','rk']})
 ],
 one:'認知神經科學保留了功能分工的可檢驗部分，推翻頭骨測人格與天真的功能清單；它和顱相學的真正分界，是有沒有認知理論、嚴謹方法與多重證據，而不是有沒有畫出腦區。'});

add({n:20,orig:'2.2',g:'neuron',title:'神經元如何產生電訊號與化學訊號',view:'neuron',legend:[],
 scenes:[
  S('靜息：膜內約 −70 mV','膜內外離子分布不均、細胞膜選擇性通透，加上鈉鉀幫浦長期維持濃度差。整體流程：電 → 化學 → 再電。',{hl:['soma'],ap:'rest'}),
  S('漸進電位：樹突與細胞體','上游釋放傳導物質 → 受體開啟離子通道 → 局部漸進電位（EPSP 靠近閾值、IPSP 遠離）。強弱可變、隨距離衰減。',{hl:['inputs','dendrite','soma'],ap:'graded'}),
  S('加總與閾值','空間加總（不同突觸同時）＋時間加總（同突觸連續）；只有在軸突起始處總和超過閾值才觸發動作電位。',{hl:['soma','hillock'],ap:'threshold'}),
  S('動作電位：去極化 → 再極化 → 超極化','電壓閘控鈉通道開，Na⁺ 流入（去極化）；鈉通道失活、鉀通道開，K⁺ 外流（再極化）；可能短暫低於靜息值（超極化＋不應期，使訊號向終端單向傳播）。',{hl:['axon'],ap:'depol'}),
  S('全有全無；強度靠頻率與數量','過閾值後單次波形不再因刺激更強而變大；強度以放電頻率與參與神經元數量表達。',{hl:['axon'],ap:'repol'}),
  S('髓鞘讓動作電位在郎飛氏結之間「跳躍」','有髓鞘軸突傳導更快、更節能。',{hl:['myelin','node'],ap:'hyper'}),
  S('終端：鈣進入 → 囊泡融合 → 釋放傳導物質','動作電位抵達終端 → 鈣通道開 → Ca²⁺ 進入 → 囊泡與膜融合 → 傳導物質進入突觸間隙。',{vb:'420 100 360 200',hl:['terminal','ca','vesicle','nt','cleft']}),
  S('突觸後：受體 → 新的漸進電位 → 清除','傳導物質結合受體，開啟離子通道或啟動細胞內訊號；之後被再吸收、酵素分解或擴散清除。乙醯膽鹼常作興奮例、GABA 作抑制例，實際效果仍依受體種類而定。',{vb:'420 100 360 200',hl:['nt','cleft','receptor','post']})
 ],
 one:'漸進電位在樹突和細胞體，強弱可變、可興奮也可抑制、會衰減；動作電位在軸突，全有全無、主動再生、不隨距離變小。突觸後電位先被整合，超過閾值才發出動作電位，終端再用化學物質把訊息交給下一個細胞。'});

add({n:21,orig:'2.1',g:'neuron',title:'神經元之間如何溝通',view:'neuron',legend:[],
 scenes:[
  S('突觸：前後兩個細胞之間有間隙','突觸前神經元的軸突終端，對著突觸後神經元的樹突或細胞體。動作電位不能像電線直接跳過去，必須先轉成化學訊號。',{vb:'420 100 360 200',hl:['terminal','cleft','post']}),
  S('五步驟：動作電位→鈣→囊泡→受體→突觸後電位','①動作電位抵達終端 ②鈣通道開、Ca²⁺ 進入 ③囊泡融合，釋放傳導物質 ④結合突觸後受體 ⑤形成興奮或抑制性漸進電位。',{vb:'420 100 360 200',hl:['terminal','ca','vesicle','nt','receptor']}),
  S('下游神經元像即時投票','它同時收到成千上萬個輸入，有的催它往前、有的踩煞車；做空間與時間加總，超過閾值才發出自己的動作電位。',{hl:['inputs','dendrite','soma','hillock'],ap:'threshold'}),
  S('學習＝突觸權重改變','同一個輸入未來能造成多大的突觸後效果，是網路學習常發生的地方。',{vb:'420 100 360 200',hl:['receptor','post']}),
  S('少數用電突觸（gap junction）','兩個細胞透過通道直接交換離子，快速、容易同步，但可調節性通常不如化學突觸；大腦多數長距離與複雜計算仍靠化學突觸。',{hl:[]})
 ],
 one:'動作電位到達終端，促使傳導物質釋放；傳導物質結合受體形成突觸後電位；下一個神經元把興奮和抑制加總，超過閾值後才發出自己的動作電位。'});

add({n:22,orig:'3.2',g:'neuron',title:'神經元如何編碼資訊',view:'spike',legend:[],
 scenes:[
  S('率編碼：放電頻率，不是波形大小','動作電位全有全無，單發高度不能表示刺激強度。刺激更符合偏好 → 每秒放電更多次。',{mode:'rate'}),
  S('調諧：刺激與放電率之間的系統關係','一顆下顳葉神經元可能對多張臉有反應、其中幾張特別高；聽覺神經元偏好某段頻率；上顳溝神經元偏好特定視線方向。',{mode:'tuning'}),
  S('時間編碼：同步可能就是「綁定」','兩群神經元都增加放電不一定代表同一物體；若它們同步放電，大腦可能把它們綁定成同一來源（視覺特徵綁定的一種可能機制）。',{mode:'sync'}),
  S('一個概念用多少神經元？','祖母細胞太脆弱也難證明；完全分散不夠節能；較符合證據的是稀疏分散式編碼。',{mode:'pop',hl:[0,1,2]}),
  S('重點：稀疏分散式','一小群神經元共同表示一個概念，每顆也參與一組相關概念；既比祖母細胞耐損，又比全腦一起編碼節能。',{mode:'pop',hl:[2]})
 ],
 one:'神經元主要用放電頻率、放電時序與群體型樣編碼資訊；訊息不在單次動作電位的大小，也通常不在一顆孤立的祖母細胞。'});

add({n:23,orig:'8.5',g:'sense',title:'語音知覺為什麼不同於音樂知覺',view:'brain',legend:['aud','lang','mot','lim'],
 scenes:[
  S('早期處理大量共用','耳朵 → 耳蝸核 → 上橄欖核 → 下丘 → MGN → A1：頻率、強度與時間變化的基本分析同時是語音和音樂的材料。不能說一開始就「語言送左腦、音樂送右腦」。',{hl:['ear','cn','son','ic','mgn','a1'],paths:['ear_cn','cn_son','son_ic','ic_mgn','mgn_a1']}),
  S('語音網路：左顳葉聽覺語言網路','類別知覺、McGurk、困難條件下發音運動表徵輔助。純詞聾（左顳葉）：能說話、可能認得環境音與音樂，但很難把語音辨認成詞。',{extra:L(430,270,34,17,-8),hl:['a1','abelt','wern','psts','broca'],paths:['a1_abelt','abelt_ifg','arcuate'],notes:[{x:300,y:350,t:'純詞聾：聽不懂語音\n音樂、環境音相對保留',to:[420,276]}]}),
  S('音樂網路：旋律、節奏、動作與記憶','經典個案 C N：雙側顳葉受損後認不出熟悉旋律，卻能理解歌詞、辨認人聲與環境音。熟悉旋律的語意記憶可能涉及前顳葉；節拍連到動作系統。',{extra:L(395,275,60,20,-6),hl:['a1','atl','sma','pmc','bg','cb'],paths:['mgn_a1'],notes:[{x:520,y:380,t:'失樂症：認不出旋律\n歌詞與人聲仍可理解',to:[420,285]}]}),
  S('音樂內部也能拆：音高 vs 時間','有人能跟上節拍卻分不出錯音，也有人音高相對保留但節奏受損；先天性失樂症常以細微音高困難為核心。',{hl:['a1','abelt','sma','bg','cb'],notes:[{x:290,y:370,t:'音高／旋律輪廓',to:[345,278]},{x:600,y:430,t:'節拍／節奏 → 動作時序系統',to:[615,368]}]}),
  S('不要簡化成「左腦語言、右腦音樂」','右半球常在音高與旋律輪廓較有優勢，左半球在快速時間變化與語言類別較突出，但兩者都依賴雙側、跨區網路。',{hl:['stg','a1']})
 ],
 one:'語音與音樂共用早期聲學分析，之後因處理目標不同而部分分流；純詞聾與失樂的雙重分離，以及音樂內部音高與節奏的分離，證明它們不是同一能力，但也不是兩套沒有交集的系統。'});

 ],

add({n:25,orig:'7.4',g:'sense',title:'臉是不是特殊的，為什麼',view:'brain',legend:['lang','vis'],
 scenes:[
  S('支持「特殊」的證據','F F A 對臉反應大於許多物體；E R P 的 N170 對臉特別敏感；臉盲者看得到五官、認得一般物體，卻無法從臉認人，只能靠聲音、髮型或情境補償。',{hl:['ffa','v23','it'],paths:['v4_it'],notes:[{x:450,y:376,t:'FFA：顳葉腹側梭狀回（右側通常較強）',to:[455,331]}]}),
  S('解釋一：任務難度','臉彼此很像、需辨認細微差異，或許任何高難度辨別都會啟動臉區。但把難度調成相近後，某些臉盲病人的臉辨認仍特別差，難度不能完整解釋。',{hl:['ffa']}),
  S('解釋二：整體（構形）處理','臉的眼鼻口之間的配置特別重要；倒置臉嚴重破壞這種整體關係（臉孔倒置效應）。',{extra:FACE(50,50,0)+FACE(110,50,1),hl:['ffa'],notes:[{x:80,y:92,t:'正立 vs 倒置'}]}),
  S('解釋三：視覺專家說','我們從小看無數張臉並做個體層次辨認；F F A 也許處理的是極度熟練的細緻辨別。受試者被訓練成 Greebles 專家後相關區與 N170 可能增加；汽車、鳥類專家也有類似效應。',{hl:['ffa','it']}),
  S('解釋四：領域特定說','臉有社會與生存重要性而演化出先天偏好的專門系統：嬰兒偏好臉狀配置、臉盲選擇性。但臉區也會回應其他物體，強版本不易成立。',{hl:['ffa','psts','atl'],notes:[{x:600,y:330,t:'STS：視線／表情（社會訊息）',to:[545,265]}]}),
  S('綜合','先天偏好＋長期經驗調校＋臉辨認本身依賴整體處理＋任務需求，四種解釋不必互斥。',{hl:['ffa','it','v23','psts']})
 ],
 one:'臉有 F F A、N170 和臉盲等特殊性證據；但特殊性可能來自領域特定、整體處理、專家經驗與任務需求的組合，不能只用一個原因下結論。'});

add({n:26,orig:'8.2',g:'sense',title:'單一細胞記錄與聽覺表徵',view:'brain',legend:['aud'],

add({n:29,orig:'2.3',g:'neuron',title:'前腦、中腦與後腦的功能比較',view:'brain',legend:['fore','midb','hind'],
 scenes:[
  S('由下往上：生命維持 → 高階整合','越接近脊髓與腦幹下方，功能越偏維持生命與基本動作；越往前腦與皮質，越能整合感覺、記憶、目標與複雜行為。三者互相連接，不是三個孤島。',{hl:['pfc','thal','bg','mid','sc','ic','cb','pons','med','hip','amy','hypo'],colors:{pfc:'var(--fore)',thal:'var(--fore)',bg:'var(--fore)',hip:'var(--fore)',amy:'var(--fore)',hypo:'var(--fore)',mid:'var(--midb)',sc:'var(--midb)',ic:'var(--midb)',cb:'var(--hind)',pons:'var(--hind)',med:'var(--hind)'}}),
  S('前腦：皮質、基底核、邊緣系統','皮質：知覺、語言、記憶、決策。基底核：動作啟動、習慣、獎賞學習。杏仁核：威脅與情緒；海馬迴：新情節記憶；扣帶皮質：衝突、動機與身體狀態。',{hl:['pfc','bg','amy','hip','acc','nacc'],colors:{pfc:'var(--fore)',bg:'var(--fore)',amy:'var(--fore)',hip:'var(--fore)',acc:'var(--fore)',nacc:'var(--fore)'}}),
  S('間腦：視丘與下視丘','視丘：多數感覺的中繼與調節站（視覺經 LGN、聽覺經 MGN）。下視丘：體溫、飢餓、口渴、性行為、自律神經與內分泌。',{hl:['thal','lgn','mgn','pulv','hypo'],paths:['retina_lgn','lgn_v1','ic_mgn','mgn_a1'],colors:{thal:'var(--fore)',hypo:'var(--fore)'}}),
  S('中腦：上丘、下丘、黑質','上丘：整合視、聽、觸線索，快速定向眼與頭；下丘：聽覺中繼；黑質：多巴胺神經元，流失 → 帕金森氏症。可在完整意識辨認之前就讓身體先反應。',{hl:['mid','sc','ic','sn'],paths:['retina_sc','cn_son','son_ic','ic_mgn'],colors:{mid:'var(--midb)',sc:'var(--midb)',ic:'var(--midb)',sn:'var(--midb)'}}),
  S('後腦：延髓、橋腦、小腦','延髓：呼吸、心跳、吞嚥。橋腦：連結大腦、小腦與腦幹，參與睡眠與喚醒。小腦：動作時序、協調與誤差修正；受損時肌力在、動作搖晃不準。',{hl:['med','pons','cb','cn'],colors:{med:'var(--hind)',pons:'var(--hind)',cb:'var(--hind)',cn:'var(--hind)'}})
 ],

function renderScene(sc,q){
  const v=sc.view||q.view;
  if(v==='brain')return brainScene(sc);
