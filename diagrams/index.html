  if(v==='hrf')return hrfScene(sc);
  if(v==='scale')return defs()+scaleScene(sc);
  if(v==='erp')return erpScene(sc);
  if(v==='erpavg')return erpAvgScene(sc);
  if(v==='spike')return spikeScene(sc);
  if(v==='neuron')return neuronScene(sc);
  return '';
}

/* ============ 詳答與濃縮申論 ============ */
const FULL={"1": ["先想像你坐在咖啡店裡。你的眼睛同時收到桌子、窗戶、路人和燈光反射出來的光；你的耳朵同時收到音樂、咖啡機、談話和車聲。感覺器官收到的不是一個個已經分好的物體，而是一大團混在一起、持續變動的物理能量。視覺收到光，聽覺收到空氣振動。大腦真正要做的，是從這些變動的輸入裡，推論外界有哪些穩定的東西。", "所以，兩個系統有兩個共同難題。第一，要把混在一起的來源分開。視覺要知道哪些邊緣屬於同一個物體，聽覺要把咖啡機和朋友的聲音分成不同聲源。第二，要做到恆常性。番茄從室內拿到陽光下，反射的光已經改變，你仍然把它看成紅色；同一首歌換了樂器或移調，你仍然知道它是同一首歌。也就是說，感覺輸入一直變，知覺卻要盡量穩定。", "因為任務相似，兩套系統的整體架構也相似。它們都會先經過視丘的中繼站，再到初級感覺皮質。視覺的視丘中繼站是外側膝狀體，也就是 LG N；聽覺的是內側膝狀體，也就是 MG N。早期皮質也都有一張有秩序的地圖。視覺依視網膜上的空間位置排列，叫視網膜拓樸；聽覺依聲音頻率排列，叫音調拓樸。再往高階處理走，兩者都大致分成腹側的 what 路徑和背側的 where 或 how 路徑。腹側回答這是什麼，背側回答它在哪裡，或我要怎麼對它採取行動。", "真正的差異，來自兩個感覺表面原本記錄的東西不同。視網膜本身就像一張空間地圖。物體落在視網膜哪裡，已經保留了它大概位於視野哪裡，所以視覺特別擅長空間定位。耳蝸不是在排外界位置，而是在排頻率。聲音從哪裡來，大腦必須比較兩耳收到聲音的時間差、強度差，以及耳廓造成的頻譜變化，才能反推出位置。因此，聽覺的空間定位通常不如視覺直接。", "反過來，聽覺很擅長處理快速的時間變化。語音裡，幾十毫秒的差異就可能讓你聽成不同音；旋律和節奏也必須沿著時間展開。視覺比較像一次攤開一張空間圖，聽覺比較像沿時間接收一條訊息流。這就是為什麼視覺偏空間優勢，聽覺偏時間優勢。", "兩者的傳導路徑也不同。視覺有上丘和 LG N，視網膜靠鼻側的纖維會在視交叉交叉，靠顳側的纖維留在同側，所以正確說法是右側視野主要送到左半球，不是右眼全部送到左腦。聽覺則從耳蝸核、下丘到 MG N，而且很早就有雙側投射，所以單側聽覺皮質受損通常不會像單側 V1 受損那樣，造成乾淨的半邊感覺消失。", "初級皮質的位置也不同。視覺的 V1 在枕葉；聽覺核心區位於上顳回的 Heschl 氏回。後續專門化方面，視覺已有相對清楚的例子，例如 V4 與顏色、V5 或 MT 與動作；聽覺也有分工，但不像視覺那樣容易用空間圖像呈現，研究設計也更依賴時間安排，因為兩段聲音不能完全占用同一時間來比較。", "最後把這題收成一句話。視覺與聽覺都要從變動的能量中分出來源並建立穩定知覺，因此都有視丘中繼、拓樸地圖和 what 與 where 路徑；核心差異是視覺的感覺表面直接保存空間，聽覺的感覺表面主要保存頻率與時間，因此視覺空間強，聽覺時間強。"], "2": ["先想像你在人群中聽到有人喊你的名字。大腦至少要解決兩件不同的事。第一，這是誰的聲音，他說了什麼。這是 what，也就是內容與身分。第二，聲音從哪裡來，我要往哪裡轉頭或怎麼回應。這是 where，進一步連到 how，也就是如何用動作和這個聲音互動。因為這兩種計算需求不同，大腦把它們放進部分分開的路徑。", "聽覺最經典的證據來自獼猴的單一細胞記錄。研究者在初級聽覺皮質周圍的帶區，也就是 belt，記錄單一神經元。前方帶區的神經元，對猴子叫聲的種類特別敏感。只要叫聲身分相同，即使位置改變，這些神經元仍保留反應，所以比較像是在回答這是什麼。後方帶區的神經元，對聲音從哪個方向來更敏感，所以比較像是在回答它在哪裡。由此可以推論，前方帶區沿顳葉往前形成腹側 what 路徑，後方帶區往頂葉形成背側 where 路徑。人類功能造影也大致看見相同分工，因此動物單細胞與人類造影互相支持。", "但聽覺背側路徑不只定位。對語音這種我們自己也能發出的聲音，大腦常常需要把聽到的聲音轉成發音動作、短期複誦或對話反應，所以研究者把其中一部分稱為 how 路徑。你可以把它想成，where 告訴你聲音在外界哪裡，how 告訴你身體要如何接住這個聲音。", "how 路徑的證據包括後上顳溝，也就是 pS TS，會把看到的嘴型和聽到的聲音整合。McGurk 效應就是例子：眼睛看到一種嘴型，耳朵聽到另一個音，大腦最後產生第三種知覺。這表示語音知覺不是耳朵單獨完成，而是視覺與聽覺資訊一起送進和發音、動作有關的系統。背側網路也會參與新音素學習、把聲音暫時放在心中複誦，以及判斷對話何時輪到自己接話。這些工作共同的地方，是把聲音轉成可以操作、維持或回應的形式。", "視覺的雙路徑可以用來對照。腹側路徑大致從 V1 經 V4 到下顳葉，負責辨認顏色、形狀、物體與臉，也就是 what。背側路徑大致從 V1 經 V5 或 MT 到後頂葉，負責位置、動作與視覺引導的行動，也就是 where 或 how。病人若腹側系統受損，可能看得到卻認不出物體或臉；背側系統受損，可能認得物體，卻無法正確定位、抓取或注意空間。兩種相反的缺損形成雙重分離，支持兩條路徑不是同一套能力的難易版本。", "所以這題不是只背前面是 what、後面是 where。真正要懂的是，大腦把「辨認內容」和「定位及採取行動」當成不同計算問題。聽覺的前帶區偏 what，後帶區偏 where；當聲音需要和發音、複誦或互動連接時，背側路徑又延伸成 how。"], "3": ["先記住最重要的一句話。fM RI 沒有直接看見神經元放電，它看見的是神經活動之後，血液供氧發生了什麼變化。也就是說，它是一個間接指標。", "想像某一小群神經元突然開始工作。工作需要能量，也會消耗氧。血液中的血紅素如果帶著氧，叫帶氧血紅素；氧被用掉後，會增加去氧血紅素。去氧血紅素具有順磁性，會讓附近磁場變得比較不均勻，使磁振訊號下降。到這裡，你可能會以為神經活動越高，訊號應該越低。", "但身體接著會啟動神經血管耦合，把更多血送到這個區域，而且送來的氧通常超過剛才用掉的量。這是一種過度補償。大量新鮮含氧血液進來後，去氧血紅素的相對比例下降，局部磁場變得比較均勻，磁振訊號反而上升。這個依賴血氧狀態的訊號，就叫 BO LD，血氧濃度相依訊號。因此，常見的 BO LD 上升不是神經元本身亮起來，而是血流在神經活動後留下的間接痕跡。", "這個血流反應不會立刻出現。神經活動發生後，訊號可能先有很小的初始下降，接著在幾秒內上升到高峰，最後回落，甚至短暫低於基線，再慢慢恢復。整條隨時間變化的曲線叫血流動力反應函數，也就是 HR F。因為它比神經元的毫秒變化慢很多，所以 fM RI 的時間解析度受到生理血流反應限制。掃描的取樣速度，也就是 TR，也會影響你多久拿到一張腦影像，但就算掃描再快，也不能讓血流自己變成毫秒反應。", "空間解析度則與體素大小有關。體素可以想成三維像素。體素越小，理論上越能分辨相鄰位置；但體素縮小後，每格收到的訊號也變少，雜訊相對變大，所以不是無限縮小就一定更好。磁場強度、掃描參數、頭部移動和血管分布也會影響實際空間精確度。考試時可以說，fM RI 通常達到毫米等級的空間解析度，遠優於頭皮 EE G 的定位，但時間解析度主要是秒等級。", "事件相關設計為什麼仍然可行。因為相鄰刺激產生的血流曲線雖然會重疊，研究者可以利用已知的 HR F 形狀和統計模型，把不同事件對訊號的貢獻估計出來。這不代表血流真的變快，而是分析方法能把疊在一起的慢訊號分開估計。", "最後比較工具。若問題是某個作業主要牽涉哪裡，fM RI 很合適；若問題是某個認知歷程在一百毫秒還是三百毫秒發生，EE G 或 ER P 更合適。把這題收好就是：神經活動先改變耗氧與血流，再形成 BO LD；體素與掃描條件決定空間細緻度，緩慢的血流反應決定時間不可能像電生理那麼快。"], "4": ["答案先說，不代表。功能造影看到的是相關，不是把那個區域拿掉之後的因果結果。", "想像你走進一間餐廳後廚，看見廚師、洗碗員、監視器和煙霧警報器都在運作。你可以說這些東西和晚餐時段有關，卻不能只憑它們正在運作，就說少了任何一個都做不出那道菜。腦造影也是一樣。某區在作業時 BO LD 上升，只表示它的活動與這個條件一起變化。它可能參與主要運算，也可能在監控、抑制、分配注意力，甚至只是因為受試者採取某種不必要的策略。", "這裡要分清必要與充分。必要是，沒有它就完成不了。充分是，只要它出現，就足以造成結果。單靠 fM RI 活化，其實兩者都不能直接證明。這題最常用的是必要性：要知道某區是不是關鍵，就要看它受損或被 TM S 暫時干擾後，作業是否選擇性變差。", "為什麼造影有活動，損傷後卻可能沒有明顯影響。第一，受試者在掃描器裡用了某個策略，例如刻意默念或預測，但那個策略不是完成作業的唯一方式。第二，作業比較困難，帶動一般性的注意力、喚醒或工作記憶網路，這些活動不等於該作業的專屬核心。第三，fM RI 對神經活動造成的血流需求敏感，卻不能只靠 BO LD 判斷這些神經元是在興奮下游，還是在進行抑制。第四，病人研究本身也可能沒有足夠樣本，病灶沒精確覆蓋目標區，或病人做的作業和造影研究根本不同。", "反過來也會發生。某區在造影中沒有顯著差異，病灶卻會讓功能受損。可能是實驗條件和控制條件都需要這個區域，相減以後共同活動被消掉；可能是區域太小、位置個別差異太大或訊號太弱；也可能病灶破壞的是經過該處的白質纖維，真正出問題的是網路連線，不是局部灰質是否亮起來。", "例如一個語意作業在造影中突出左下額回，某些嚴重語意缺損的病人卻主要傷在前顳葉。這不是叫我們選一邊相信，而是提醒我們，任務可能同時需要選擇、提取、儲存和控制，兩種方法剛好看見不同環節。", "所以，造影與損傷結果不一致時，最好的反應不是說某種方法錯了，而是追問作業、控制條件、策略和網路連結哪裡不同。最後一句話是：活躍只表示相關；要證明某腦區對功能是必要的，必須用自然損傷、TM S 或其他因果操弄，看讓它失效後功能是否下降。"], "5": ["先把腦傷研究想成拆機器。你不知道一台機器裡每個零件做什麼，於是觀察某個零件壞掉後，哪些功能消失、哪些還在。這種逆向工程很有用，但要從一台受損機器推回正常設計，必須先接受幾個前提。", "第一是區分性假設，也可理解為認知系統能被選擇性破壞。它主張，腦傷有可能只破壞某個認知成分，而讓另一個成分相對保留。如果所有功能永遠一起壞，我們就無法從缺損型態推論系統有哪些零件。要注意，這裡的成分是認知運算，不一定等於一個整齊的小腦區。這個假設大致合理，因為臨床上確實看得到選擇性缺損，但真實病灶通常不會像拔掉一顆積木那麼乾淨。", "第二是透明性假設。它主張，腦傷後看到的系統，仍是正常系統少掉或減弱某些成分，而不是大腦重新發明了一套完全不同的認知架構。若病人已經用全新方法完成作業，我們就不能直接把他的表現當成正常系統被減去一部分。這是最有爭議的假設，因為大腦有可塑性，也會發展代償策略。一般來說，用成人後天腦傷推論，比用兒童早期腦傷更安全；表現穩定、恢復歷程清楚時，也較容易評估是否有大幅重組。", "第三是普遍性假設。它主張不同人的基本認知架構足夠相似，所以一位病人的選擇性缺損，能提供一般人認知系統的線索。這不是說每個人大腦完全一樣，而是說核心處理架構有可比性。問題在於個別差異確實存在，因此單一個案能提出強而有意思的反例，卻不能自動代表所有人。", "接著要懂單一分離的陷阱。假設病人做作業 A 很差，作業 B 正常，你可能說 A 和 B 是兩個系統。但也可能兩個作業使用同一套資源，只是 A 比 B 難。腦傷讓整體資源下降後，較難的 A 先壞，較容易的 B 還撐得住。這叫作業資源假象。也可能 A 的指示、反應方式或感覺需求比較複雜，缺損來自附帶要求，不是你想測的核心能力。", "雙重分離可以加強推論。若病人一是 A 差、B 好，病人二恰好 A 好、B 差，就很難再用單純難度解釋，因為同一個 B 不可能在所有人身上都比較容易。母音與子音處理的互補個案，就是用這種邏輯支持兩者至少部分依賴不同機制。", "但雙重分離也不是自動證明兩個完全獨立的盒子。研究者仍要確認作業純度、錯誤類型、病灶範圍和其他替代解釋。這題最後可以這樣收：腦傷推論依賴區分性、透明性與普遍性；三者都有一定合理性，也都有現實限制，因此要用雙重分離、多項作業和群體證據一起加強結論。"], "6": ["這題先分清兩個研究問題。若你想知道某種缺損通常和哪裡的病灶有關，常會把許多病人放在一起做團體研究。若你想知道一個看似完整的能力，其實可以拆成哪些部分，單一個案往往更有力量。", "單一個案的第一個優點，是保留一個人的完整缺損型態。假設十位病人裡，五位聽得懂但說不出，另外五位說得出卻聽不懂。若把兩組直接平均，結果可能像是大家的說和聽都中度受損，真正的互補分離反而消失。深入研究個案，才能看見功能不是平均地變弱，而是某些零件受損、某些零件保留。", "第二個優點，是能做細緻的錯誤分析。只看總分，你只知道病人答錯多少；看他錯的是母音還是子音、熟悉臉還是陌生臉、常見視角還是不常見視角，才有機會推論處理歷程卡在哪一層。第三，若找到兩個表現相反的個案，就能形成雙重分離，對認知架構提出很強的限制。第四，罕見而純粹的個案本來就不容易湊成大樣本，若堅持只做群體，重要現象可能永遠無法研究。", "缺點也很明確。第一，普遍性有限。一個人的病前能力、病灶、恢復和策略都很特殊，不能只憑一人估計一般人出現某現象的比例。第二，它依賴上一題的三個假設，特別是透明性與普遍性。第三，一個單一分離可能只是作業難度或附帶要求造成，所以需要更多作業和互補個案。第四，自然腦傷通常範圍不規則，可能同時傷到灰質、白質和遠端網路，不能把一位病人的症狀簡單釘在一個小點上。", "團體研究可以補上統計穩定性和病灶位置的共同關聯，但也可能把個別差異平均掉。因此，兩種方法不是競爭關係。單一個案最擅長問認知功能如何拆分，團體研究最擅長問某種缺損在一群人中和哪些病灶穩定相關。最好的結論，是讓個案提出精細模型，再用更多個案、團體與其他方法檢驗。"], "7": ["共同邏輯先講。功能造影是在看某區和作業一起活動；損傷法則是讓某區不能照常工作，再看作業是否變差。因此，損傷法比較能回答必要性和因果問題。自然腦傷是現實中已經發生的長期損傷；TM S 和 tE S 是研究者在安全範圍內，暫時改變正常大腦的活動。", "自然腦傷的優點，是效應真實而且可能很大。研究者能看見某套系統嚴重受損後，人的知覺、語言或記憶會變成什麼樣子。但自然腦傷不是研究者設計的。病灶常跨越多個區域，形狀不規則，也可能破壞白質連線；病人之間病前能力、恢復時間和代償程度不同。它是永久或長期的，大腦有時間重組，所以因果解釋會受到透明性問題影響。", "TM S 是經顱磁刺激。線圈中的快速電流產生磁場，磁場穿過顱骨，在下方皮質誘發電流。若在某個作業的關鍵時間點刺激相關區域，會打亂原本正在進行的神經活動，使表現暫時下降。把它叫虛擬損傷可以幫助記憶，但更精確的理解是暫時干擾，而不是把腦區完全關掉。", "TM S 的優勢是可逆、可控制，而且能在同一個人身上比較刺激與控制條件，減少個別差異。研究者也能改變刺激時點，問一個區域是在刺激後八十毫秒、兩百毫秒還是更晚才必要，因此它同時提供空間與時間上的因果線索。缺點是主要影響靠近頭皮的皮質，聚焦範圍有限卻不是一個精確小點，效應通常比真實腦傷小，也有安全與舒適度限制。", "盲人點字研究很能說明它的價值。造影發現早盲者讀點字時枕葉視覺皮質活躍，但活躍可能只是伴隨現象。當 TM S 干擾盲人的中枕葉後，點字或凸字辨識真的變差；同樣刺激對戴眼罩的明眼人影響不大。這表示盲人的視覺皮質不只亮起來，而是已被重組成觸覺辨識所必要的部分。", "tE S 是經顱電刺激，常見形式是 tD CS。它以很弱的直流電改變神經元接近放電閾值的程度。課堂常用簡化口訣：陽極傾向提高興奮性，陰極傾向降低興奮性。更精確地說，它是偏壓整個網路的可興奮性，效果會受腦區、任務、刺激方向與當下狀態影響，因此不像 TM S 那樣適合把某區當成短暫損傷。它的空間定位也較粗，但可以用較長時間刺激，研究學習與刺激結束後的後效。", "所以，自然腦傷效應大、真實，但不可控且會重組；TM S 短暫、可控，適合檢驗某區在何時必要；tE S 更像調高或調低網路的興奮傾向。三者互補，沒有一種能完整取代其他方法。"], "8": ["先想為什麼一定要比較條件。即使你躺著什麼都不做，大腦也一直在活動。當你看到一個字時，腦中同時有視覺、注意、辨字、理解、準備反應等歷程。只看這一個條件，無法知道某片活動到底對應哪一環。", "認知減法的做法，是準備兩個盡量相似的作業。實驗作業比控制作業多一個你想研究的認知成分。把兩個條件的腦活動相減，共有部分會被抵銷，剩下的差異就被解讀為那個額外成分的活動。像做料理時，比較兩份幾乎相同的食譜，唯一差別是其中一份加了辣椒；若味道差異真的只來自辣椒，你就能把兩份的差別歸因於辣椒。", "經典例子是看一個字，和看一個外形簡單的符號相比。兩者都有基本視覺輸入，但只有字需要詞形或詞彙處理。相減後留下的活動，被用來找文字處理相關區域。這個邏輯源自 Donders 的反應時間減法，後來被移到功能造影。", "最大問題叫純插入假設。它假定，把一個新認知成分放進作業時，其他原有成分完全照舊。現實中，歷程會互相影響。你看字時的注意方式、眼動與視覺分析，可能從一開始就和看符號不同，不是先完成一套相同視覺處理，再額外插入詞彙模組。因此，相減留下來的差異未必只屬於一個乾淨成分。", "第二個問題是基線選擇。控制作業太簡單，會同時多出難度、注意和反應差異；控制作業太相似，又可能也包含你想研究的成分，結果在相減時一起消失。例如朗讀減掉看字，留下的差異不只包含發音，還可能包含動作規劃、執行、聽到自己的聲音與錯誤監控，很難說是一個單一功能。", "研究者如何改善。第一是因子設計，同時操弄兩個因素，不只看每個因素的主效果，也看交互作用。交互作用能直接檢驗一個因素是否改變另一個因素的效果，不必假設各成分互不影響。第二是認知聯集，找多個不同對比都共同出現的區域，降低單一基線造成的偶然性。第三是參數設計，讓自變項連續改變，例如工作記憶負荷逐步增加，看腦活動是否跟著有規律地變化。", "最後一句話是：認知減法把實驗作業減去控制作業，想留下額外認知成分；它的弱點是純插入常不成立，而且結果高度依賴基線，因此需要因子、聯集與參數設計補強。"], "9": ["答案是不會，因為兩種方法回答的問題不同。", "功能造影擅長告訴我們，正常人在某個作業中，哪些區域或網路的活動跟著改變。它可以同時觀察全腦，空間定位也比早期只靠病人症狀猜測精確。但它主要提供相關性。某區亮起來，可能是在做核心運算，也可能只是提供注意、策略、抑制或監控。沒有亮起來，也可能只是被基線相減、訊號太弱或個體位置不一致。", "損傷法則從另一個方向問：這個系統不能正常運作後，功能是否會選擇性失敗。若病灶或 TM S 干擾某區後，某作業穩定變差，才比較能支持該區或該網路對這個功能是必要的。這是造影本身無法取代的因果資訊。", "損傷法當然也有自己的問題。自然病灶通常很大而且不規則，會破壞連線，還可能引發遠端效應與長期重組。病人使用的策略和正常人不同，樣本也難以完全配對。因此，不能把損傷結果當成毫無雜訊的真相。", "兩種方法不一致時，反而最有價值。若造影有活動、損傷後功能仍在，我們要檢查那個活動是否只是非必要策略，或病人是否已由其他網路代償。若造影沒有差異、損傷卻造成缺損，我們要檢查共同基線是否把必要活動消掉，或病灶是否破壞了穿過該處的連線。這些矛盾會迫使理論把任務拆得更細。", "而且，兩者會互相幫忙。造影可以提出候選腦區與網路，再用損傷或 TM S 檢驗必要性；結構影像可以更準確描出病灶；病人的選擇性缺損又能告訴造影研究，應該比較哪些認知成分。", "所以結論不是誰比較高級，而是證據鏈。造影告訴你正常系統在哪些地方一起活動，損傷法告訴你失去哪些部分會讓功能失敗。要建立可靠的認知神經科學理論，兩者必須交叉驗證。"], "10": ["先分清皮質盲和盲視。初級視覺皮質 V1 受損後，對應視野中的刺激無法形成正常的有意識視覺，這叫皮質盲。病人可能缺半邊視野、四分之一視野，或一小塊視野。盲視則是其中一種令人驚訝的表現：病人主觀上真誠地說自己什麼都沒看見，可是在被迫二選一時，對位置、方向或動作的判斷卻高於隨機猜測。", "想像螢幕左邊閃了一條斜線。病人說，我不知道，左邊是黑的。研究者不接受不知道，要求他猜斜線往左還是往右。若只是亂猜，長期應接近百分之五十；但病人可能穩定高於百分之五十，而且手指或眼球也會朝刺激位置移動。重點不是他偶爾猜中，而是大量試次後表現可靠地高於機率，同時仍缺乏看見的主觀經驗。", "這表示視覺訊息不只走一條路。主要路徑是視網膜到 LG N，再到 V1，之後進入更高階視覺皮質。V1 受損後，這條支撐精細而有意識視覺的主路被破壞。但部分訊息仍可能經上丘、丘腦枕核或其他旁路到達外紋狀視覺區；也有從 LG N 某些細胞群繞到 MT 或 V5 的路徑，特別有助於快速定位與動作偵測。", "研究者還必須排除其他解釋。例如是不是 V1 沒有完全破壞，只剩一點組織；是不是光散射到完好的視野。結構影像、精細視野測量和控制條件可以降低這些疑慮。當表現只在特定刺激與路徑上出現，也更支持替代視覺通路，而不是病人偷看或裝盲。", "盲視對正常視覺有三個啟示。第一，視覺系統是多條平行路徑，不是只有眼睛到 V1 的單線流程。第二，處理資訊和意識到資訊可以分離。大腦可能已經算出刺激在哪裡、是否在動，卻沒有產生我看到了的經驗。第三，V1 對有意識、精細而可報告的視覺非常重要，但某些快速、粗略、無意識的視覺行為可以部分繞過它。", "最後避免一個過度簡化。盲視不是正常視覺完整保留，只少了意識。病人的辨別通常粗糙、受限而且不穩定，視覺處理本身也已受損。最準確的說法是：盲視顯示受損而無意識的視覺處理仍可能存在，因此視覺辨別和主觀視覺意識不是完全相同的東西。"], "11": ["這題不能只答必要或不必要，因為視知覺不是單一能力。你必須先問，是哪一種視覺。是有意識地看見，是精細辨認，還是只做出粗略的定位與動作反應。", "先看支持 V1 很重要的證據。V1 受損後，對應視野會出現皮質盲，病人無法像正常人一樣報告那裡有什麼。V1 也保留視網膜拓樸，並分析邊緣、方向、明暗與波長等基本特徵。後面的顏色、形狀、物體和動作處理，都需要建立在這些早期分析上。因此，V1 不是一塊只負責讓畫面出現的螢幕，而是把視網膜輸入整理成高階系統可使用格式的重要入口。", "V1 也和視覺意識密切相關。盲視病人可能對刺激作出高於機率的判斷，卻沒有我看到了的主觀感受。這讓我們推論，V1 以及它和高階視覺區之間的迴返互動，對正常、有意識、可報告的視覺經驗非常重要。", "但盲視同時證明，V1 不是所有視覺行為的唯一入口。部分視覺訊息可以經上丘、丘腦枕核或從 LG N 到外紋狀皮質的旁路，支持快速定向、眼球移動和粗略動作偵測。這些能力通常沒有正常視覺那麼精細，也缺乏清楚意識，卻表示 V1 受損不等於大腦完全收不到任何視覺資訊。", "必要和充分也要分開。即使我們說 V1 對正常有意識視覺近乎必要，也不表示 V1 自己就充分。V1 完好，只能完成早期分析；要認顏色還需要 V4 等區域，要看動作需要 MT 或 V5，要認物體與臉需要下顳葉網路，還要有注意與記憶系統共同參與。", "所以考場上可以分層作答。對有意識的視覺經驗與精細辨認，V1 幾乎是必要條件；對粗略定位、定向與部分動作處理，V1 不是唯一必要路徑；而對完整視知覺，V1 又不是充分條件。這樣就不會把它答成全有或全無。"], "12": ["先理解恆常性為什麼是問題。眼睛收到的影像其實非常不穩定。光源一變，物體反射到眼睛的波長會變；你走近或走遠，影像大小會變；換個角度，物體投在視網膜上的形狀也會變。如果大腦只是照單全收，你每走一步，世界都會像換了一批東西。恆常性就是大腦利用脈絡與記憶，從變動影像中推論那個相對穩定的物體。", "先講顏色恆常。同一顆紅番茄在日光、黃燈和陰影下，送進眼睛的波長比例不相同，但你仍傾向把它看成紅色。大腦不能只問這一小塊反射了什麼波長，還要比較它和周圍表面的關係，估計整個場景的光源。就像相機自動白平衡，不是把每個像素當成孤立訊號，而是先猜目前照明偏黃還是偏藍，再修正對物體表面顏色的判斷。", "V1 對局部波長與明暗很敏感，因此光源一變，它的反應也會跟著改。V4 與更高階腹側視覺系統會整合較大範圍的脈絡，讓顏色知覺相對不受照明改變。V4 受損可能造成大腦性色覺缺失，病人看世界接近灰階，卻仍可保留形狀、深度和質地。這顯示顏色不是物體直接送進大腦的固定標籤，而是視覺系統比較與推論後的結果。", "物體恆常的問題更大。同一個咖啡壺從正面、側面或斜上方看，視網膜影像都不同。大腦會從當下影像抽出相對穩定的特徵、部件關係或主軸，再和記憶中儲存的物體表徵比對。下顳葉的神經元感受野很大，常不太在意物體落在哪個小位置，而更在意它是什麼，因此適合建立跨位置與大小的物體身分。", "但物體恆常不是只有一條處理。研究發現，有些系統偏向判斷物體身分是否相同，有些系統保留視角與方向資訊。左側下顳葉或梭狀回的表徵，常較能跨不同大小和角度把它視為同一物體；右半球與頂葉網路對視角、空間方向更敏感。病人也可能能認出物體是什麼，卻無法判斷它朝哪個方向；也可能只在熟悉視角能認出，換成不尋常角度就失敗。", "功能磁振的適應現象可以檢驗這件事。若同一神經表徵被重複使用，第二次反應通常會降低。若物體換了角度，某區仍出現反應降低，表示那區把不同視角當成同一身分；若換角度後反應恢復，表示那區仍區分視角。要記得，適應研究的邏輯是重複同一表徵會降低，不是提高。", "最後一句話是：顏色恆常靠比較局部與場景脈絡，估計物體表面顏色；物體恆常靠把變動影像轉成較穩定的結構與身分表徵，同時由另一部分系統保留視角和方向資訊。"], "13": ["先理解語音為什麼難。你以為每個音都有一個固定聲音，其實沒有。說話時，嘴巴正在發前一個音，就已經開始準備下一個音，這叫協同發音。因此，同一個音素在不同前後文中，實際聲學訊號會變；反過來，不同聲學訊號也可能被聽成同一音素。大腦必須在高度變動的聲音中，找出說話者想表達的穩定類別。", "動作理論提出一個答案。聽者辨認的不是聲波本身，而是推論說話者打算做哪一種發音動作。因為自己的大腦知道舌頭、嘴唇和聲帶怎麼產生聲音，所以可以利用這套運動表徵，反推別人剛才做了什麼。這裡的動作表徵不等於你一定真的動嘴複誦，而是發音系統能為聽覺判斷提供預測。", "McGurk 效應是第一個直覺證據。若眼睛看到一種嘴型，耳朵同時聽到另一個音，人常會知覺成第三個音。閉上眼睛後，錯覺可能消失。這表示大腦在判斷語音時，會把可見的發音動作和聲音合併。後上顳溝是重要的多感官整合區；下額葉與前運動皮質等發音動作區，也可能隨最後知覺到的音而改變活動。", "但要精確說，McGurk 效應直接證明的是視聽整合，不能單獨證明語音一定要靠運動系統。更直接的支持來自 TM S 與造影。當語音清楚時，干擾前運動皮質可能影響不大；當聲音有雜訊、介於兩個音素之間或很難判斷時，干擾發音相關運動區會讓辨別變差。這表示動作系統像一個輔助預測器，在聽覺證據不夠清楚時特別有用。", "鏡像神經元常被放進這個理論。這些神經元在自己做動作，以及看到或聽到別人做類似動作時都可能反應，提供感知和動作可以共享表徵的可能機制。學習外語音素時，只被動聽通常不如同時練習發音有效，也支持知覺和動作互相校準。", "類別知覺則解釋大腦如何把連續聲音切成離散音素。以 da 和 ta 為例，聲帶開始振動的時間可以一點一點連續改變，但主觀知覺通常不是聽見無限多個中間音，而是在某個界線前聽成一類，界線後聽成另一類。大腦把連續物理差異壓縮成語言需要的類別，發音系統可能參與這個分類，但類別知覺本身也不只存在於語音。", "最重要的限制是，動作理論的強版本不成立。如果發音運動區是語音知覺唯一基礎，那些區域受損的人應該幾乎聽不懂語音；實際上，許多人只在困難條件下出現輕微障礙。因此最穩的結論是：語音知覺主要依賴聽覺與多感官系統，運動表徵會提供預測和輔助，尤其在訊號模糊或需要學習時，但它不是唯一必要機制。"], "14": ["先把神經元想成一個會收訊、決定和傳送的細胞。樹突和細胞體接收很多上游訊號，軸突起始處決定是否送出訊息，軸突再把訊息傳到下一群細胞。這個過程主要有兩種電位：漸進電位和動作電位。", "漸進電位也叫突觸後電位。神經傳導物質結合受體後，讓膜電位局部變得比較容易或比較不容易達到放電閾值。它可以興奮，也可以抑制；強度有大有小，而且沿樹突和細胞體被動傳遞時會逐漸衰減。神經元會把同一時間、不同位置傳來的許多漸進電位加總。", "若總和在軸突起始處超過閾值，就產生動作電位。動作電位是全有全無，單次波形大小大致固定，沿軸突傳遞時會靠電壓閘控離子通道不斷再生，所以不會像漸進電位那樣一路變小。刺激較強時，不是每個動作電位變得更大，而是單位時間內出現得更頻繁。", "不同電生理技術利用不同尺度的訊號。單一細胞記錄把非常細的電極放在神經元裡或附近，直接記錄動作電位，通常以每秒放電次數分析。它能精細回答某個神經元偏好哪種臉、聲音、位置或動作，但具侵入性，因此多用於動物，少數在人類手術時使用。", "EE G 是在頭皮放電極。頭皮離單一神經元太遠，無法穩定看見單顆細胞的動作電位。EE G 主要反映大量皮質錐體神經元同步產生的突觸後電位。為什麼要大量、同步而且排列方向相近。因為每顆細胞的電場很小，方向雜亂會互相抵銷；只有許多平行細胞同時活動，電場才足以傳到頭皮。", "EE G 可以看不同頻帶，也能把每次刺激後的訊號對齊並平均，得到 ER P。它的最大優點是毫秒等級時間解析度，價格與操作也相對容易。缺點是空間定位差，因為頭皮上的一組電位分布，可能由腦內許多不同來源組合造成，這叫逆問題。", "ME G 測的是神經電流造成的磁場。磁場較不受頭皮與顱骨扭曲，定位通常優於 EE G，時間解析度同樣是毫秒等級，但設備昂貴，需要磁屏蔽與高度敏感的感測器。它對來源方向與深度也有條件，不是所有深部活動都能清楚測到。", "所以這題的核心是先分訊號，再配工具。動作電位適合單一細胞記錄；大量同步突觸後電位形成 EE G 與 ER P；相同神經電流伴隨的磁場形成 ME G。電生理擅長回答何時發生，fM RI 則較擅長回答哪裡發生。"], "15": ["EE G 是頭皮上持續記錄的腦電，裡面同時混有感覺、注意、思考、眨眼和許多與當下刺激無關的背景活動。若你只看一次刺激後的波形，真正和刺激有關的訊號很容易被淹沒。ER P 的做法，是把每一次刺激出現的時刻設為零點，切出刺激前後的一小段 EE G，再把許多試次對齊平均。", "為什麼平均有用。與刺激時間鎖定的反應，每次大致在相近時間出現，所以平均後會保留下來；與刺激無關的背景活動，有時正、有時負，平均後會彼此抵銷。你可以把它想成反覆拍攝同一個微弱圖案，固定圖案會越疊越清楚，隨機雜點則會淡掉。這就是 ER P，也就是事件相關電位。", "讀波形時，橫軸是刺激後經過的毫秒，縱軸是電位。P 表示正向峰，N 表示負向峰，後面的數字常指大約出現的時間，例如 N170 或 P300。正負只是頭皮電位方向，不等於興奮和抑制，也不代表好或壞。", "ER P 如何檢驗理論。研究者系統性改變一個認知因素，觀察哪個時間窗的振幅、潛時或頭皮分布跟著改變。若操弄在一百多毫秒就產生差異，表示它影響較早的知覺處理；若差異到三百毫秒後才出現，較可能涉及辨認、記憶或決策。兩個因素若改變不同成分，也支持它們至少部分依賴不同處理階段。", "臉處理是清楚例子。N170 約在刺激後一百七十毫秒出現，對臉通常比一般物體大，和臉的早期結構編碼有關。N250 對熟悉或特定身分的臉較敏感，較接近臉身分表徵。三百毫秒後的晚期成分可能跨越臉和名字，反映人物知識。這讓研究者不只說有一個臉區，而是提出一條時間序列。", "另一個例子是聯想促發。只看反應時間，促發與刺激清晰度可能出現交互作用，容易讓人以為促發改變早期知覺。但 ER P 若顯示清晰度在一百五十毫秒內影響波形，促發卻到三百毫秒後才出現，就能把兩個歷程分開，修正原本理論。", "限制一定要講。第一，一個觀察到的峰是許多神經來源相加後的結果，不是一個峰就等於一個純粹心理模組。成分和認知歷程的對應是根據操弄、時序與其他證據做的推論。第二，ER P 空間定位差，有逆問題。第三，它需要許多試次，眼動、眨眼和說話肌肉都會造成大雜訊。", "最後一句話是：ER P 透過刺激鎖定平均，從 EE G 中抽出毫秒級反應；它能用成分出現的時間和對操弄的敏感度檢驗認知歷程，但成分不是心理功能的直接標籤，來源仍需其他方法確認。"], "16": ["這題可以先把臉辨識拆成三層。第一層是知覺編碼，大腦分析眼睛、鼻子、嘴巴及彼此配置。第二層是臉身分辨識，把不同光線、表情和角度下的影像認成同一張臉。第三層是人物身分與知識，知道這個人是誰、和自己有什麼關係；這一層不只可由臉觸發，也可由名字或聲音觸發。", "單一細胞記錄貢獻的是表徵方式。猴子下顳葉可找到對臉比對一般物體反應更強的神經元，但多數不是只對唯一一張臉放電，而是對一組臉有不同程度反應。這不支持極端祖母細胞，也就是每個人物各有一顆專屬細胞。", "人類手術中的記錄曾發現，內側顳葉某些神經元對特定名人高度敏感，不只看到不同照片會反應，看到名字也可能反應。這聽起來像祖母細胞，但研究者不可能測遍世界上所有刺激，因此不能證明它只代表那一個人。較穩妥的解釋是稀疏編碼：一個概念由相對少量但不只一顆的神經元共同代表，每顆神經元也可能參與不只一個相關概念。", "單一細胞還告訴我們，臉系統不只辨認身分。上顳溝有神經元對視線方向、表情或頭部動作敏感，這些資訊有助於判斷別人正在注意哪裡、想做什麼，因此臉也是社會訊息來源。", "ER P 的主要貢獻是時間順序。N170 約在一百七十毫秒出現，對臉與臉狀結構特別敏感，通常在右後顳區較大。它不太在意這是不是名人，因此較像早期臉結構編碼，不是回答這是誰。N250 對熟悉臉、同一人物的不同照片較敏感，較接近特定臉身分表徵。三百毫秒以後的成分可以同時被臉和名字影響，較接近跨感官的人物知識。", "這些時間資訊也能裁決理論。例如漫畫化的臉有時更容易辨認。如果漫畫臉先增強 N170，表示效果已出現在知覺編碼階段，較支持漫畫放大了視覺上有辨識力的特徵，而不是記憶裡本來就儲存一張漫畫版臉。聯想促發若只影響晚期成分，也表示它較可能作用於知覺之後的人物知識，而非早期臉結構分析。", "限制是，ER P 難以精確定位來源，單一細胞結果又只抽樣極少數神經元，而且常來自動物或特殊手術個案。因此最好的結論是：單一細胞告訴我們臉與人物概念可能如何被選擇性和稀疏地編碼，ER P 告訴我們知覺編碼、臉身分和人物知識大致在什麼時間依序出現。"], "17": ["大腦可塑性是，神經系統會因經驗、練習、感覺缺失或損傷，改變哪些區域參與哪些功能，以及連線與興奮性如何分配。功能造影可以看到重組後哪裡活躍，但不能單獨證明新活躍區真的有功能。TM S 的貢獻，就是暫時干擾那個區域，檢驗它是否已成為新任務的必要部分。", "最經典的是早盲者讀點字。正常明眼人用指尖辨認凸字，主要依靠體感覺皮質；早盲者除了體感覺區，枕葉的視覺皮質也會活躍。若這只是盲人在腦中想像，干擾枕葉不應影響表現。實驗卻發現，TM S 干擾早盲者中枕葉後，點字或凸起字母辨認下降；同樣干擾對戴眼罩的明眼人影響較小。這提供因果證據，顯示原本處理視覺的皮質，已被徵用來支援精細觸覺與空間辨認。", "可塑性不只跨感官。長期使用某個身體部位，對應的體感覺或動作代表區可能擴大；缺乏輸入或截肢後，原本代表區可能縮小或被鄰近功能侵入。這表示皮質地圖不是出生後就永遠固定，而會受使用量、學習和輸入競爭影響。", "但重組也不是大腦任意把任何區塊拿來做任何事。早盲者的視覺皮質接手點字辨認，仍有功能相似性：視覺與點字都需要高精度空間模式分析。後來研究也發現枕葉可參與語言等較高階作業，表示限制不是絕對，但網路原有連線與計算特性會影響它最容易接手什麼。", "tD CS 則讓研究者以弱電流偏壓皮質興奮性。課堂上的簡化是陽極傾向提高、陰極傾向降低。若刺激視覺皮質後，早期視覺 ER P 或微弱刺激偵測系統性改變，就表示改變皮質狀態會改變知覺。刺激停止後仍持續的後效，可能與突觸可塑性和神經傳導物質調節有關，因此 tD CS 常被用來研究學習，而不只瞬間干擾。", "限制是，TM S 主要刺激表淺皮質，實際影響範圍與網路效應不易完全確定；tD CS 更不聚焦，陽極和陰極的效果也會依情境改變。兩者的效應通常比自然腦傷小。因此最穩的結論是：造影指出可塑性可能發生在哪裡，TM S 檢驗重組區是否已成為必要節點，tD CS 則用興奮性與後效研究可塑性如何被調整。"], "18": ["心身問題其實在問一個很難的問題。大腦是由神經元、離子、化學物質和血流組成的物質系統，可是我們卻有疼痛、顏色、思想、選擇和自我感。這些主觀心智，和物質大腦到底是兩種東西，還是同一件事的不同描述。因為現代討論主要集中在大腦，稱為心腦問題會更精確。", "第一種框架是二元論。笛卡兒認為心與身是兩種不同實體。身體有空間、可被物理法則描述；心是非物質的思想實體。兩者能互相影響，他推測交會點在松果體。二元論符合很多人的直覺：我好像不只是肉體。但它給認知神經科學一個巨大難題。若非物質心靈不屬於物理世界，它如何推動神經元，又如何被實驗工具測量。認知神經科學通常不採取這個立場。", "第二種框架是雙重面向論。斯賓諾莎式的想法是，心和腦不是兩個實體，而是同一個實在的兩種描述角度。你可以從外部描述神經元如何放電，也可以從第一人稱描述自己正在害怕；兩個描述都指向同一事件，只是使用不同概念。就像同一首歌可以用聲波頻譜描述，也可以用旋律與情緒描述。頻譜沒有否定旋律，旋律也不是另一個漂浮的實體。", "第三種框架是一元論，特別是物理一元論。它主張心智活動由物質大腦產生，沒有另一個獨立的非物質心靈。化約論是其中較強的版本，認為未來神經科學足夠成熟後，記憶、注意或情緒等心理概念，可能被神經生物概念取代。歷史上燃素被氧化理論淘汰，化約論者認為某些心理概念也可能有相似命運。", "但現階段，知道一個腦區或神經傳導物質改變，仍不足以取代心理層次的說明。研究者若不知道什麼叫工作記憶、抑制、辨認或意識，就無法設計有意義的神經實驗。這使雙重面向或較溫和的一元論很有吸引力：心智依賴大腦，但心理與神經描述可能在不同問題上各有用途。", "這門課的基本立場偏向一元論，也就是研究大腦能幫助理解心智，神經科學不需要假設一個無法測量的非物質心靈。可是，一元論不等於現在就能把所有心理概念刪掉。最後可以答：二元論把心身視為兩種實體；雙重面向論把它們視為同一實在的兩種描述；一元論認為心智來自大腦，化約論更預測心理概念終將被生物概念取代，而目前認知神經科學仍需要心理層次的理論。"], "19": ["答案是，不是，但如果研究只剩下把功能貼到腦區上，就有重蹈顱相學的風險。", "顱相學在十九世紀初提出兩個主張。第一，不同腦區負責不同能力。第二，一個能力越發達，對應腦區越大，會把頭骨頂出不同形狀，所以摸頭骨就能判斷人格與能力。第一個主張含有功能專門化的早期直覺，第二個主張則沒有可靠根據。", "後來的損傷、電刺激、單一細胞與造影研究確實顯示，大腦不是每一區都做完全相同的事。Broca 的病人支持語言產出與特定左額葉網路有關；Wernicke 等研究又顯示語言不是一個單一能力，理解、產出與概念可以部分分離。Penfield 的皮質刺激與現代感覺動作地圖，也支持局部功能差異。因此，顱相學關於功能可能有區域差異的直覺，並非全部錯誤。", "它真正失敗的地方有兩個。第一，頭骨外形不能可靠反映下面腦區大小，更不能據此量人格。第二，它先發明一串像母愛、破壞性或堅定等含糊能力，再替每個能力找一塊位置，缺乏可檢驗的認知理論與嚴謹實驗。它是在貼標籤，不是在說明資訊如何被處理。", "現代認知神經科學有比較強的方法。它用損傷、TM S、電生理、單細胞與造影交叉驗證，也用控制條件、統計與可重複研究限制解釋。更重要的是，認知心理學先把能力拆成可操作的歷程，例如語音辨識、詞彙提取、動作規劃，再問這些歷程如何由腦網路實現。", "但風險仍然存在。看到杏仁核活躍就說這是恐懼中心，看到前扣帶活躍就說這個人在說謊，都是把複雜心理功能直接釘在一個亮點上。活躍不等於必要，一個腦區也常參與多種功能。若只問哪裡亮，卻不問作業中的計算、網路互動與替代解釋，就會變成新的顱相學。", "定位論與分散論也不必二選一。基本感覺與動作有相對清楚的地圖和專門化；語言、記憶、推理與情緒通常依賴跨區網路。現代較合理的觀點是，有些區域在某種計算中較關鍵，但它們透過高度互聯的網路工作。", "所以一句話收束：認知神經科學保留了功能分工的可檢驗部分，推翻頭骨測人格與天真的功能清單；它和顱相學的真正分界，是是否有認知理論、嚴謹方法與多重證據，而不是有沒有畫出腦區。"], "20": ["先抓全流程。神經元內部長距離傳遞主要靠電，兩個神經元之間多數靠化學，下一個神經元收到後又轉回電。因此可以記成：電、化學、再電。", "神經元安靜時，細胞膜內側相對外側帶負電，大約負七十毫伏。這個靜息膜電位來自膜內外離子分布不均、細胞膜選擇性通透，以及鈉鉀幫浦長期維持濃度差。上游神經元釋放傳導物質後，受體讓特定離子通道開啟，於是在樹突和細胞體形成局部的漸進電位。", "興奮性突觸後電位讓膜電位往閾值靠近，抑制性突觸後電位讓它遠離閾值或穩定在較難放電的狀態。神經元會進行空間加總，也就是不同突觸同時相加；也會進行時間加總，也就是同一突觸短時間內連續輸入相加。只有總和在軸突起始處達到閾值，才觸發動作電位。", "動作電位開始時，電壓閘控鈉離子通道打開，鈉離子快速流入，膜內變得較正，叫去極化。接著鈉通道失活，鉀離子通道打開，鉀離子外流，膜電位回到較負，叫再極化。鉀通道關得稍慢，可能短暫低於靜息值，形成超極化與不應期。不應期讓神經元不會立刻無限連續放電，也使動作電位主要向軸突終端傳播。", "動作電位是全有全無。過閾值後，單次波形不會因原始刺激更強而無限變大。刺激強度主要由放電頻率和參與神經元數量表達。有髓鞘的軸突，動作電位會在郎飛氏結之間進行跳躍式傳導，因此更快、更節能。", "動作電位抵達軸突終端後，會開啟鈣離子通道。鈣離子進入終端，使裝有神經傳導物質的囊泡與細胞膜融合，把傳導物質釋放到突觸間隙。傳導物質擴散並結合突觸後受體，開啟離子通道或啟動細胞內訊號，形成下一輪漸進電位。之後傳導物質會被再吸收、酵素分解或擴散清除，避免訊號一直持續。", "課堂常以乙醯膽鹼作興奮例子、GA BA 作抑制例子。更精確地說，效果也取決於受體種類與所在細胞；同一傳導物質在不同受體上可能有不同作用。考試時若依講義作答，可以先抓興奮讓膜電位靠近閾值、抑制讓它更難到閾值這個機制。", "最後比較兩種電位。漸進電位在樹突和細胞體，強弱可變、可興奮也可抑制、會隨距離衰減；動作電位在軸突，全有全無、主動再生、不隨距離變小。整個神經溝通就是，突觸後電位先被整合，超過閾值產生動作電位，終端再用化學物質把訊息交給下一個細胞。"], "21": ["上一題講完整的電與化學循環，這一題把焦點縮到兩個神經元交接訊息的地方，也就是突觸。", "上游神經元叫突觸前神經元，下游神經元叫突觸後神經元。多數情況下，訊息從突觸前神經元的軸突終端，傳給突觸後神經元的樹突或細胞體。兩個細胞通常沒有直接碰在一起，中間有極小的突觸間隙，所以動作電位不能像電線一樣直接跳過去，必須先轉成化學訊號。", "流程可以一口氣串起來。第一，動作電位沿軸突抵達終端。第二，終端的電壓閘控鈣通道開啟，鈣離子進入。第三，含有神經傳導物質的囊泡和膜融合，把傳導物質釋放到突觸間隙。第四，傳導物質結合突觸後受體，改變離子通道或細胞內訊息。第五，突觸後膜形成興奮性或抑制性漸進電位。", "重點是，下游神經元不會收到一個興奮訊號就立刻放電。它同時收到成千上萬個突觸輸入，有些催它往前，有些踩煞車。它會把不同位置的輸入做空間加總，也把短時間連續輸入做時間加總。只有在軸突起始處的總和超過閾值，才產生自己的動作電位，繼續把訊息送下去。", "因此，神經元的溝通不是電話線一對一傳話，而比較像一場即時投票。每個突觸投出一點支持或反對，神經元根據總和決定是否發出全有全無的動作電位。網路中的學習，也常發生在這些突觸權重改變上，也就是同一個輸入未來能造成多大的突觸後效果。", "少數地方使用電突觸，例如 gap junction。兩個細胞透過通道直接交換離子，速度快，也容易同步，但可調節性通常不如化學突觸。大腦多數長距離與複雜計算仍仰賴化學突觸。", "一句話收好：動作電位到達終端，促使傳導物質釋放；傳導物質結合受體，形成突觸後電位；下一個神經元把興奮和抑制加總，超過閾值後才發出自己的動作電位。"], "22": ["動作電位是全有全無。這代表一個很重要的限制：神經元不能用單次動作電位的高度，表示刺激有多強或看到了什麼。每一發的大小大致相同，資訊必須放在別的地方。", "最基本的是率編碼，也就是放電頻率。刺激出現後，某顆神經元每秒從五次變成四十次，表示這個刺激更符合它偏好的特徵。刺激更強時，神經元可能不是放出更大的動作電位，而是在同一時間內放得更密。單一細胞記錄就是數這些尖峰，畫出神經元對不同刺激的調諧曲線。", "例如一顆下顳葉神經元可能對多張臉都有反應，但對其中幾張放電特別高；一顆聽覺神經元可能對某段頻率最敏感；一顆上顳溝神經元可能對特定視線方向反應較強。這些例子說明，資訊不是用文字寫在神經元上，而是由刺激和放電率之間的系統關係表示。", "第二種是時間編碼。資訊可能放在神經元何時放電，以及不同神經元是否同步。兩群神經元都增加放電，仍不一定代表同一物體；若它們以相同節奏同步放電，大腦可能把它們綁定成同一來源。視覺研究中，同一條光棒跨越兩個感受野時，兩區活動較同步；若是兩條分開的光棒，雖然兩區都放電，同步性較低。這提供特徵綁定的一種可能機制。", "第三個問題是，一個概念由多少神經元代表。極端局部表徵是假設一個概念對應一顆祖母細胞。它有效率，卻非常脆弱，而且實驗幾乎無法證明一顆細胞只對唯一刺激反應。另一個極端是完全分散，所有神經元都平均參與所有概念，這又可能不夠有效率。", "較符合證據的是稀疏分散式編碼。一個概念由一小群神經元共同表示，每顆神經元也參與一組相關概念。這既比祖母細胞更耐損，又比全腦一起編碼更節能。所謂對某名人反應的細胞，較可能是這個概念網路中的一員，不是整個人的記憶只存放在那一顆細胞裡。", "最後一句話是：神經元主要用放電頻率、放電時序與群體型樣編碼資訊；訊息不在單次動作電位的大小，也通常不在一顆孤立的祖母細胞。"], "23": ["最安全的答案不是兩者完全不同，也不是兩者完全一樣，而是早期處理大量共用，高階分析與記憶部分分開。", "兩者都從耳朵和早期聽覺皮質開始。大腦先分析頻率、強度與時間變化，這些基本聲學特徵同時是語音和音樂的材料。因此，不能說耳朵一開始就把語言送左腦、音樂送右腦。分化是在後續系統如何把聲音組織成音素、詞、旋律、節拍與意義。", "最有力的證據是雙重分離。一類病人有純詞聾，常涉及左顳葉聽覺語言網路。他們能說話，也可能認得環境音與音樂，卻很難把聽到的語音辨認成詞。另一類病人，例如經典個案 CN，雙側顳葉受損後無法認出熟悉旋律，卻仍能理解口說歌詞、辨認人聲或環境音。若語音和音樂只是同一能力的難易差別，不容易出現兩種相反缺損。", "語音還有一些特殊處理。它把連續聲學差異切成音素類別，叫類別知覺；它會把看到的嘴型和聽到的聲音整合，出現 McGurk 效應；在困難條件下，發音運動表徵也會輔助判斷。這些機制特別適合高速、具有語言類別和溝通目的的聲音。", "音樂內部也不是單一能力。音高與節奏可以分離。有人能跟上節拍卻分不出旋律中的錯音，也有人音高相對保留但節奏處理受損。先天性失樂症常對細微音高差異特別困難，但節奏與語音功能未必同等受損。熟悉旋律的辨認還涉及音樂語意記憶，可能和前顳葉網路有關。", "因此，簡化成左腦語言、右腦音樂會誤導。右半球常在音高與旋律輪廓上較有優勢，左半球常在快速時間變化與語言類別上較突出，但語音和音樂都依賴雙側、跨區網路。", "這題最後可以說：語音與音樂共用早期聲學分析，之後因處理目標不同而部分分流；純詞聾和失樂的雙重分離，以及音樂內部音高與節奏的分離，證明它們不是同一能力，但也不是兩套完全沒有交集的系統。"], "24": ["先講結論。它可以在高度受控、選項有限的實驗中，對某些腦活動型樣做高於機率的分類；但這和在真實世界可靠測謊，或直接讀出一個人的具體內心，差得非常遠。", "傳統測謊機測心跳、呼吸、皮膚導電等自律神經反應。問題是，這些指標反映一般喚起。無辜的人因害怕也可能很緊張，熟練說謊者卻可能平靜。它沒有直接測量謊言，只是在測某些常伴隨謊言的身體反應。", "fM RI 直接測大腦，聽起來更接近源頭。但說謊不是一個單一心理動作。你可能要記住真相、抑制真話、編造替代答案、監控自己是否前後一致，還要推測對方知道什麼。這些歷程牽涉前額葉、前扣帶、記憶與心智理論網路。不同類型的謊言又不一樣：臨時編造和事先背好的說法，可能使用不同策略。因此，不存在一個看到它亮就能判定說謊的單一腦區。", "更大的問題是，實驗室通常要求受試者在沒有真正後果的情況下，照指示說真話或假話；真實說謊有動機、恐懼、利害、練習與反制策略。從受控樣本得到的準確率，不能直接搬到法庭或個人判斷。基準率也很重要。即使測驗在實驗中看似準確，若實際受測者大多沒有說謊，少量偽陽性也會造成許多誤判。", "讀心常使用 MV PA，也就是多體素型樣分析。它不是只找哪裡最亮，而是觀察一群體素的細微活動圖樣。研究者先讓分類器學習受試者看到臉、房子、鞋子等已知刺激時的型樣，再測試它能否判斷新的試次屬於哪一類。也可以在非常受控的視覺刺激中，從 V1 活動重建粗略圖案，或在兩個預先指定的心像任務間分類。", "這種方法做的是有限選項辨識，不是打開大腦字幕。分類器通常已經知道可能答案，並在同一任務、相近情境和足夠訓練資料下判斷。它較可能分出你在想運動還是空間移動，卻不能自然地知道你想起哪一年、哪一個人、對他有什麼複雜感受。每個人的學習經驗、腦部對齊和概念表徵都不同，開放式想法沒有固定字典可查。", "所以這題的核心是分清分類和讀心。功能造影能在封閉選項中解碼某些粗略類別，也可能為無法行動的病人建立簡單溝通；它目前不能可靠測出真實世界的謊言，也不能讀出任意、具體而私密的思想。腦區活躍仍只是需要謹慎解釋的模式，不是心理狀態的直接印章。"], "25": ["答案是，臉確實有相對專門的神經與認知證據，但它為什麼特殊，仍有多種可能解釋。", "先看支持特殊性的證據。功能造影常發現梭狀回臉區，也就是 FF A，對臉比許多一般物體有更強反應。ER P 中的 N170 也對臉與臉狀結構特別敏感。臨床上，臉盲患者可能看得到眼睛、鼻子和嘴巴，也能辨認一般物體，卻無法從臉認出家人，只能靠聲音、髮型或情境補償。選擇性缺損表示臉處理至少有部分獨立機制。", "但特殊的原因有四種解釋。", "第一是任務難度。臉彼此很像，我們卻要辨認細微差異，也許臉區只是被任何高難度辨別啟動。問題是，研究把臉和其他物體作業調成相近難度後，某些臉盲病人的臉辨認仍特別差，因此難度不能完整解釋。", "第二是整體處理。辨認一般物體時，我們常可依賴局部零件；辨認臉時，眼睛、鼻子和嘴巴之間的配置關係特別重要。把臉倒過來會嚴重破壞這種整體關係，造成著名的臉孔倒置效應。這支持臉的特殊性可能來自高度依賴整體與構形處理。", "第三是視覺專家說。每個人從小看過無數張臉，而且必須在同一類別內做個體層次辨認。也許 FF A 不是天生只處理臉，而是處理我們極度熟練的細緻辨別。受試者被訓練成 Greebles 等新奇物體的專家後，臉相關區與 N170 可能增加；汽車或鳥類專家看專長物件時也有類似效應。", "第四是領域特定說。它認為臉因社會與生存重要性，演化出先天偏好的專門系統。嬰兒對臉狀配置的偏好、臉盲的選擇性與穩定臉區，都能支持這個方向。但所謂臉區通常仍會回應其他物體，專家效應也存在，所以強版本的只處理臉並不容易成立。", "這四種解釋不必互斥。大腦可能帶有臉的先天偏好，長期經驗又把相關網路調得更精細，而臉辨認確實高度仰賴整體處理。最後可以答：臉有 FF A、N170 和臉盲等特殊性證據；但特殊性可能來自領域特定、整體處理、專家經驗與任務需求的組合，不能只用一個原因下結論。"], "26": ["單一細胞記錄的價值，是直接觀察某一顆神經元在不同聲音下如何改變放電。它讓研究者不只知道一大片聽覺皮質有活動，而能問這顆細胞偏好哪個頻率、音量、位置或複雜聲音。", "第一個重要發現是音調拓樸。耳蝸先把不同頻率分開，聽覺皮質仍保留有秩序的頻率地圖。頻率相近的聲音，傾向由位置相近的神經元表示。依課堂圖示，核心區可看到低頻與高頻沿空間規律排列。這就像視覺皮質保存視網膜位置，只是聽覺地圖保存的是頻率，不是外界位置。", "第二個發現是階層處理。核心區神經元可能只對很窄的頻率範圍敏感；外圍帶區整合多個核心輸入，對較寬頻率組合、頻率變化方向或猴子叫聲等複雜聲音反應更強。這和視覺系統從局部邊緣逐步組合成複雜形狀相似：越往高階，偏好的刺激通常越複雜，對簡單物理特徵的依賴越少。", "第三，單一細胞顯示聽覺神經元可以同時編碼音量與位置。有些神經元只在特定聲強下反應，有些對某個方向特別敏感，許多細胞會同時受兩者影響。這提醒我們，神經元不一定各自只代表一個純特徵，實際編碼常是多維的。", "第四，單細胞證據幫助建立 what 和 where 路徑。獼猴前方帶區神經元對叫聲身分有較高選擇性，即使聲音位置改變仍保留反應，像是在辨認這是什麼；後方帶區神經元對聲音位置最敏感，像是在判斷它在哪裡。這成為前方腹側 what 與後方背側 where 路徑的重要起點證據。", "限制是，單一細胞記錄具侵入性，多數資料來自動物；記錄到的少數細胞也不等於整個人類聽覺系統。研究者需要再和人類造影、病灶與行為互相驗證。最後一句話是：單細胞記錄揭露聽覺皮質的音調地圖、由核心到帶區的階層、音量與位置調諧，以及前方 what、後方 where 的分流。"], "27": ["答案是部分不同。音樂不是從耳朵開始就走一條完全獨立的專線，而是在共用早期聲學分析之後，發展出部分專門的旋律、節奏、動作和獎賞網路。", "第一個證據是與語音的雙重分離。純詞聾患者可能聽不懂口語，卻仍能欣賞或辨認音樂；失樂患者則可能無法辨認熟悉旋律，語音理解相對保留。經典個案 CN 就無法認出旋律，卻能辨認口說歌詞與其他聲音。這表示高階語音和音樂處理不是同一套系統的單純難易差別。", "第二，音樂內部也能分解。Peretz 與 Coltheart 的模型把音樂處理區分為音高相關與時間相關路徑。旋律輪廓、音程和調性偏向音高組織；節拍與節奏偏向時間組織。個案可能只在音高或只在節奏上受損，先天性失樂症也常以細微音高辨識困難為核心。這表示音樂不是一個不可再分的模組。", "第三，音樂會強烈連結動作系統。即使坐著不動，聽規律節拍也可能啟動前運動皮質、輔助動作區、小腦與基底核。原因是預測節拍本身就像準備下一個動作時間點；演奏、拍手和舞蹈更需要聽覺與動作回饋持續校準。", "第四，音樂的情緒與愉悅會使用一般獎賞與情緒網路，而不是音樂專屬的快樂中心。當熟悉段落帶來期待與高潮，獎賞迴路可能參與；這些區域也會回應其他有獎賞價值的刺激。因此，音樂有獨特結構處理，也會借用領域通用的情緒和獎賞系統。", "最後不要寫成右腦音樂、左腦語言。右半球常較擅長細緻音高與旋律，左半球可能較擅長快速時間分析，但音樂的不同成分分布在雙側網路。最穩的結論是：音樂與其他聲音共用早期聽覺分析，之後在音高、節奏與熟悉旋律記憶上出現部分專門化，同時又連結動作與一般獎賞系統。"], "28": ["團體研究想解決的核心問題是，單一病人的病灶太特殊。若很多具有相同缺損的人，都在某些位置有共同損傷，我們對病灶和功能的關聯會更有信心，也能進行統計估計。", "分組可以從三個方向開始。第一，依臨床症候群分組，例如某類失語症。這方便連結疾病分類，但同一症候群內的認知缺損和病灶可能仍很不同。第二，依特定認知症狀分組，例如都出現語意理解缺損，再回頭尋找共同病灶。這更貼近認知理論，但症狀可能由不同原因造成。第三，依解剖位置先選病人，例如都有左前顳葉損傷，再檢驗哪些功能共同受影響。這適合測試造影提出的預測，但若同一功能可由多個節點受損造成，只選一個區域會漏掉其他路徑。", "現代病灶症狀映射可以逐體素比較。研究者把許多病人的病灶對齊，檢查某個體素受損是否與行為分數系統性相關，畫出統計熱點。這比只看幾張病灶重疊圖精細，也能把連續行為表現納入。", "但團體研究有幾個限制。第一，自然病灶不是隨機發生。血管分布使某些區域常一起受損，研究者可能誤把鄰近區當成真正關鍵點。第二，結構影像不一定完整顯示功能失效範圍，腫瘤、水腫、出血或外傷尤其複雜。第三，局部損傷會讓遠處但連線相依的區域暫時低下，叫遠距效應或 diaschisis。症狀可能來自整個網路失衡，不是病灶點單獨負責那個功能。", "第四是解釋過度。若 X 區受損後 F 功能變差，合理結論是 X 或經過 X 的網路對 F 的某些面向很重要。不能直接說 F 就存放在 X，更不能說 X 的唯一目的就是 F。前者把網路功能縮成位置，後者把腦區人格化，都容易走向新顱相學。", "團體研究和單一個案仍要互補。團體研究提供位置關聯、變異範圍與統計穩定性；單一個案保留精細的功能分離與錯誤型態。最後一句話是：團體研究能從多位病人中找必要節點與病灶熱點，但必須控制分組異質性、病灶共變、遠距效應與過度定位，並用個案和其他方法檢驗。"], "29": ["先建立一張由下往上的地圖。越接近脊髓與腦幹下方，功能越偏向維持生命和基本動作；越往前腦與大腦皮質，越能整合感覺、記憶、目標與複雜行為。這只是整體趨勢，不表示低處不重要或高處能獨立工作。", "前腦包括終腦和間腦。終腦包含大腦皮質、基底核與邊緣系統。大腦皮質支援知覺、語言、記憶、決策與有意識行為。基底核不只是控制動作，也參與習慣、技能與獎賞學習；多巴胺系統受損會影響動作啟動，例如帕金森氏症，另一些基底核病變則可能造成過多不自主動作。邊緣相關結構中，杏仁核對威脅與情緒意義敏感，海馬迴對形成新的情節記憶重要，扣帶皮質參與衝突、動機與身體狀態整合。", "間腦的視丘是主要中繼與調節站。除了嗅覺外，多數感覺訊息會經視丘再到皮質；視覺經 LG N，聽覺經 MG N。視丘不只是被動轉接，也會受到注意與皮質回饋調節。下視丘維持體內平衡，調節體溫、飢餓、口渴、性行為、自律神經與內分泌。", "中腦包含上丘、下丘與黑質等結構。上丘整合視覺、聽覺和觸覺線索，快速控制眼睛與頭部朝重要刺激定向；下丘是重要聽覺中繼與整合站。這些路徑可在完整有意識辨認之前，先讓身體對突然出現的光或聲音作出反應。黑質與基底核迴路相連，黑質多巴胺神經元流失是帕金森氏症的重要機制。", "後腦包括延髓、橋腦與小腦。延髓控制呼吸、心跳、吞嚥等維持生命的功能；橋腦連結大腦、小腦與腦幹多個系統，也參與睡眠與喚醒；小腦負責動作的精確時序、協調和誤差修正，也參與動作學習。小腦受損時，肌力可能還在，動作卻變得搖晃、不準、說話不流暢或眼球控制異常。", "所以可以用一句話串起來：前腦負責高階整合、感覺中繼、動機與目標行為；中腦負責快速定向、部分感覺整合與動作調節；後腦維持基本生命功能，並讓動作平衡、流暢和精確。三者不是三個孤島，而是從生命維持到高階認知持續互相連接的系統。"], "30": ["答案是，兩者目前互相需要，因為它們提供不同層次的限制。", "認知心理學在沒有直接量腦的年代，已經靠反應時間、錯誤率、促發和記憶表現，建立許多成功的資訊處理模型。這表示一個心理理論不會只因沒有畫腦圖就失去價值。可是腦資料可以成為新的依變項。除了問受試者答得多快、答對多少，也能問不同條件改變哪些腦區、何時出現 ER P 差異，以及兩個看似相同的行為結果是否依賴不同神經路徑。", "腦資料也能限制心理理論。兩個模型若都能預測相同反應時間，卻對處理階段或神經適應提出不同預測，造影與電生理可能把它們區分開。重複文字即使大小寫改變，左梭狀回仍出現重複抑制，就支持某個階段已把表面大小寫差異轉成較抽象的詞形表徵。這不只告訴我們在哪裡，也告訴我們表徵可能具有什麼性質。", "常見的硬體與軟體比喻有幫助，但不完整。電腦程式可以由設計者任意放到不同硬體；人類認知則由大腦的演化、發展、連線速度與可塑性共同形成。大腦的物理限制會影響資訊是平行還是串列處理、哪些功能容易共享資源，以及受損後能如何代償。因此，認知模型不能永遠把實現它的生物系統當成完全無關。", "反過來，神經科學更需要認知心理學提供可研究的問題。掃描器看到的是血氧型樣，電極看到的是電位，顯微鏡看到的是細胞；它們不會自己標示這是記憶提取、語意選擇或衝突監控。研究者必須先用認知理論定義作業、控制條件與可能歷程，才能知道腦訊號差異代表什麼。沒有這一層，研究很容易退化成看哪裡亮，再隨意貼上一個心理標籤。", "這也連回顱相學與心身問題。純粹定位而沒有好的心理概念，會變成新顱相學；只談心理歷程而完全不讓腦證據限制，又可能忽略人類系統真正的生物條件。未來心理概念會不會被完全化約，仍沒有定論，但現在兩種語言都不可少。", "最後一句話是：認知心理學告訴神經科學要區分哪些處理與表徵，神經科學則用大腦的時間、位置、連線與因果證據限制認知模型；兩者不是互相取代，而是互相校正。"]};
const BRIEF={"1": {"a": "兩者都要從混雜、不斷變動的能量中分出來源並建立穩定知覺，所以架構相似；差別在感覺表面保存的資訊——視網膜存空間，耳蝸存頻率。", "pts": ["**共同難題**：①來源分離（哪些邊緣屬同一物體／哪個聲音屬哪個聲源）②**恆常性**（紅番茄換光源仍是紅；同一首歌換調仍是同一首）。", "**共同架構**：視丘中繼（視覺 **LGN**、聽覺 **MGN**；聽覺上行：耳蝸核→**上橄欖核**→下丘→MGN）→ 初級皮質有序地圖（**視網膜拓樸**／**音調拓樸**）→ 高階分 **腹側 what**、**背側 where／how**。", "**差異一**：視覺空間強（視網膜直接保留位置）；聽覺時間強（幾十毫秒決定語音差異），位置要靠兩耳時間差、強度差、耳廓頻譜反推。", "**差異二**：視覺鼻側纖維在視交叉交叉，右視野→左半球；聽覺很早就雙側投射，單側聽覺皮質受損不會像單側 V1 那樣整片半邊消失。", "**專門化**：視覺 V4（顏色）、MT/V5（動作）證據充分；聽覺的特徵專門化記載較少（課本比較表）。", "**位置**：V1 在枕葉（BA17）；聽覺核心區 A1 在上顳回的 Heschl 氏回（BA 41，帶區 BA 42）。"]}, "2": {"a": "辨認內容與定位＋行動是不同的計算問題，聽覺與視覺都把它們分進部分分開的路徑。", "pts": ["**what（腹側）**：A1→前方帶區→顳葉前部／下額葉；獼猴前帶區神經元對叫聲「種類」敏感，聲音位置改變仍保留反應。", "**where（背側）**：A1→後方帶區→後頂葉；對聲音「方向」敏感，負責位置與空間。", "**how**：背側路徑連前運動皮質／Broca 區，支援複誦、學新音素、輪流對話；pSTS 整合嘴型與聲音（McGurk）。", "**視覺對照＝雙重分離**：腹側 V1→V4→IT 受損，看得到卻認不出；背側 V1→MT→後頂葉受損，認得卻抓不準。", "分流是**部分**而非絕對，兩條路徑持續互動。"]}, "3": {"a": "fMRI 量的是神經活動後的血氧變化（BOLD），是間接指標；空間約毫米，時間約秒。", "pts": ["**生理歷程**：神經活動耗氧 → 去氧血紅素增加（順磁性，磁場不均勻，訊號先略降）→ **神經血管耦合**送來過量含氧血 → 去氧血紅素比例下降、磁場變均勻 → **BOLD 上升**。", "**HRF**：初始小下降 → 數秒內到高峰 → 回落並短暫低於基線 → 慢慢恢復。", "**時間解析度**受血流限制（秒級），不是掃描速度；TR 只決定多久取樣一次，掃再快血流也不會變毫秒。事件相關設計靠已知 HRF＋統計模型分離重疊的訊號。", "**空間解析度**由體素大小、磁場強度、雜訊、頭動與血管分布決定；體素越小訊號越弱，不是無限縮小越好。", "**取捨**：問「哪裡」用 fMRI；問「幾百毫秒時發生」用 EEG／ERP。"]}, "4": {"a": "不代表。造影的活躍是相關，不是必要性；要證明必要要看「拿掉之後功能是否選擇性下降」。", "pts": ["**必要 vs 充分**：fMRI 活化兩者都不能直接證明；必要性要靠自然損傷或 **TMS** 干擾。", "**活躍但損傷無影響**：①受試者用了非唯一的策略 ②作業難度帶動一般注意／喚醒網路 ③BOLD 分不出興奮或抑制 ④病人研究樣本少、病灶沒涵蓋目標區或作業不同。", "**不活躍卻有缺損**：條件與控制都需要該區，相減後被抵銷；區域太小或個別差異大；病灶破壞的是經過的**白質纖維**（網路問題）。", "**例**：語意作業活化左下額回，嚴重語意缺損病人卻傷在前顳葉——任務含選擇、提取、儲存、控制，兩種方法看到不同環節。", "**結論**：不一致時應追問作業、控制條件、策略與網路連結，而非判定哪個方法錯。"]}, "5": {"a": "從腦傷成人推論正常認知要接受三個假設：區分性、透明性、普遍性，三者大致合理但各有限制。", "pts": ["**區分性**：認知成分能被選擇性破壞（臨床確有選擇性缺損，但病灶很少像拔積木般乾淨；成分是運算，不一定等於小腦區）。", "**透明性**：腦傷後看到的是「正常系統少掉某些成分」，而非重新發明的架構——最有爭議，因可塑性與代償；成人後天腦傷比兒童早期腦傷安全。", "**普遍性**：不同人的核心認知架構足夠相似，個案才能推及一般人（個別差異使單一個案不能代表全體）。", "**單一分離陷阱**：A 差 B 好，可能只是 A 較難（作業資源假象）或附帶要求較多。", "**雙重分離**（病人一 A 差 B 好、病人二相反，如母音／子音互補個案）加強推論，但仍須檢查作業純度與替代解釋。"]}, "6": {"a": "單一個案最擅長問「能力如何拆分」；團體研究最擅長問「缺損與病灶如何穩定相關」，兩者互補。", "pts": ["**優點**：①保留完整缺損型態（十人平均會把互補分離抹掉）②可做細緻**錯誤分析**（母音／子音、熟悉／陌生臉）③兩個相反個案形成**雙重分離**④罕見而純粹的個案無法湊大樣本。", "**缺點**：①普遍性有限，無法估計現象比例 ②依賴透明性與普遍性假設 ③單一分離可能只是作業難度 ④自然病灶不規則，涉及灰質、白質與遠端網路。", "**團體研究**補統計穩定性與病灶位置共同性，但會平均掉個別差異。", "**結論**：個案提出精細模型，團體與其他方法再檢驗。"]}, "7": {"a": "損傷法比造影更能回答必要性與因果；自然腦傷效應大但不可控，TMS 暫時可控，tES 則偏壓興奮性。", "pts": ["**自然腦傷**：效應真實且大；但病灶不規則、常破壞白質、病人間差異大，且長期存在會重組（透明性問題）。", "**TMS**：線圈快速電流→磁場穿顱→誘發皮質電流，**暫時干擾**（虛擬損傷）。優點：可逆、受試者自身對照、可操弄**刺激時點**（八十毫秒 vs 兩百毫秒），給空間＋時間因果線索；缺點：多影響表淺皮質、聚焦有限、效應較小。", "**例（點字）**：造影見早盲者枕葉活躍；TMS 干擾中枕葉後點字辨識變差、明眼人不受影響 → 視覺皮質已重組為觸覺必要部分。", "**tES／tDCS**：弱電流改變放電閾值，陽極傾向提高、陰極傾向降低興奮性；空間較粗，適合研究學習與刺激後的後效。", "三者互補，無一能完整取代其他。"]}, "8": {"a": "認知減法：用「多一個成分」的實驗作業減去控制作業，剩下的差異歸給該成分；弱點是純插入假設與基線選擇。", "pts": ["**做法**：兩個盡量相似的作業，唯一差別是要研究的成分；相減後共有活動抵銷。例：看字 − 看符號 → 詞形處理。源自 **Donders** 反應時間減法。", "**問題一：純插入假設**——假定加入一個成分不改變其他成分；實際上歷程會互相影響（看字的注意與眼動可能從頭就不同）。", "**問題二：基線選擇**——太簡單則混入難度／注意差異，太相似則把想研究的成分也減掉；例：朗讀 − 看字混有動作規劃、聽自己聲音、錯誤監控。", "**改善**：**因子設計**（看交互作用，不需假設互不影響）、**認知聯集**（多個對比共同出現的區域）、**參數設計**（連續改變負荷，看活動是否規律跟著變）。"]}, "9": {"a": "不會。兩者回答不同問題：造影給正常系統的相關活動，損傷法給必要性的因果證據。", "pts": ["**造影**：全腦觀察、定位精確，但是**相關**——活躍可能是核心運算，也可能是注意、策略、抑制或監控；不活躍可能被基線相減掉。", "**損傷法**：病灶或 TMS 後功能選擇性變差，才支持該區／網路是**必要**的——造影無法取代。", "**損傷法的問題**：病灶大且不規則、破壞連線、遠端效應、長期重組與代償策略、樣本難配對。", "**不一致更有價值**：有活動但損傷後功能在 → 查非必要策略或代償；無差異卻有缺損 → 查基線相減或白質連線被破壞。", "**互補**：造影提候選區 → 損傷／TMS 檢驗必要性；結構影像精確描病灶；病人缺損指引造影比較什麼。"]}, "10": {"a": "盲視＝V1 受損後主觀上看不見，被迫二選一時對位置、方向或動作的判斷卻高於機率；顯示視覺是多條平行路徑，且處理與意識可分離。", "pts": ["**定義**：V1 受損造成皮質盲；盲視病人否認看見，但強迫選擇（斜線方向、位置）穩定高於 50%，手或眼球也朝向刺激。", "**旁路**：視網膜→**上丘**／丘腦枕核→外紋狀視覺區；或 LGN 某些細胞群→**MT/V5**（快速定位、動作偵測）。", "**需排除**：V1 殘留組織、光散射到好的視野——用結構影像、精細視野測量、控制條件；表現只在特定刺激出現更支持替代通路。", "**啟示**：①視覺是平行多路徑 ②處理資訊與**意識**到資訊可分離 ③V1 對有意識、精細、可報告的視覺很重要，但粗略、無意識的視覺行為可繞過它。", "**限制**：盲視辨別粗糙、不穩定，不是「正常視覺只少了意識」。"]}, "11": {"a": "視知覺不是單一能力：對有意識、精細的視覺 V1 幾乎必要；對粗略定位與動作則非唯一路徑；對完整視知覺 V1 又不充分。", "pts": ["**支持重要**：V1 受損→對應視野皮質盲；V1 保留視網膜拓樸，分析邊緣、方向、明暗、波長，是高階顏色／形狀／物體／動作處理的入口。", "**與意識相關**：盲視無「看見」感，推論 V1 及其與高階視覺區的**迴返互動**對有意識視覺很重要。", "**非唯一入口**：上丘、丘腦枕核、LGN→外紋狀皮質的旁路支持定向、眼動、粗略動作偵測。", "**必要 ≠ 充分**：V1 完好只完成早期分析，還需 V4（顏色）、MT/V5（動作）、下顳葉（物體／臉）、注意與記憶。", "分層作答：有意識精細辨認 → 幾乎必要；粗略定位／動作 → 非唯一；完整視知覺 → 不充分。"]}, "12": {"a": "恆常性＝從變動影像推論相對穩定的物體；顏色靠場景脈絡估光源，物體靠抽取穩定結構與身分。", "pts": ["**問題**：光源、距離、視角一變，視網膜影像就變；不修正則每走一步世界都換了一批東西。", "**顏色恆常**：比較表面與周圍、估計整體照明（像相機自動白平衡）。V1 對局部波長敏感，隨光源改變；**V4**／腹側整合大範圍脈絡，使顏色相對穩定；V4 受損→大腦性色覺缺失（近灰階，形狀、深度保留）。", "**物體恆常**：抽出穩定特徵／部件關係，與記憶表徵比對；**下顳葉**感受野大、不在意位置，建立跨位置／大小的身分。", "**兩套處理**：左側下顳／梭狀回偏跨大小視角的身分；右半球與頂葉保留視角、方向。病人可認得是什麼卻說不出朝向，或只認得熟悉視角。", "**適應（fMRI）**：重複同一表徵 → 反應**降低**；換視角仍降低＝該區視為同一身分，恢復＝區分視角。"]}, "13": {"a": "語音知覺有動作成分，但強版本動作理論不成立：運動表徵是輔助預測器，在訊號模糊或學習時最有用。", "pts": ["**問題**：協同發音使同一音素聲學變動，不同聲學也可被聽成同一音素。", "**動作理論**：聽者辨認的是推論出的發音動作，利用自己的運動表徵反推別人做了什麼。", "**McGurk 效應**：看到的嘴型與聽到的音整合成第三個音 → 視聽整合（**pSTS**）；但它直接證明的是整合，不單獨證明運動系統必要。", "**TMS／造影**：語音清楚時干擾前運動皮質影響小；雜訊或介於兩音素間時，干擾發音運動區會讓辨別變差。鏡像神經元＝知覺與動作共享表徵的可能機制；外語音素「聽＋說」優於只聽。", "**類別知覺**：連續的聲學差異（如 VOT，da↔ta）被切成離散音素，界線前後聽成不同類別。", "**限制**：若運動區是唯一基礎，受損者應聽不懂，但實際只在困難條件下輕微障礙。"]}, "14": {"a": "動作電位是全有全無、沿軸突再生；漸進電位會加總、衰減；EEG／MEG 測的是大量同步的突觸後電位。", "pts": ["**漸進電位**：突觸後電位，可興奮或抑制、強度可變、被動傳遞會衰減，神經元對其做空間與時間加總。", "**動作電位**：軸突起始處超過閾值才產生；全有全無、電壓閘控通道使其再生不衰減；刺激越強，**頻率**越高而非振幅越大。", "**單細胞記錄**：電極在細胞內或附近直接記錄尖峰；精細但侵入性，多用於動物。", "**EEG**：頭皮電極測大量**錐體神經元同步、方向平行**的突觸後電位（方向雜亂會抵銷）；可取 ERP；毫秒時間解析度、便宜，但空間差（**逆問題**）。", "**MEG**：測神經電流的磁場，較不受顱骨扭曲、定位較好，但設備昂貴、需磁屏蔽，對來源方向與深度有條件。", "電生理擅長「何時」，fMRI 擅長「哪裡」。"]}, "15": {"a": "ERP＝把許多試次對齊刺激時間後平均，從 EEG 抽出與刺激鎖定的毫秒級反應；用成分的時間與對操弄的敏感度檢驗認知歷程。", "pts": ["**為何平均**：刺激鎖定的反應每次在相近時間出現會保留，無關背景活動時正時負而抵銷。", "**讀波形**：橫軸毫秒、縱軸電位；P／N 表正負向峰、數字是約略時間（N170、P300）；正負不等於興奮／抑制或好壞。", "**檢驗理論**：操弄一因素，看哪個**時間窗**的振幅、潛時、頭皮分布改變——一百多毫秒＝早期知覺；三百毫秒後＝辨認、記憶、決策；兩因素影響不同成分＝至少部分不同階段。", "**例（臉）**：N170＝臉結構編碼；N250＝熟悉／特定身分；300 ms 後＝人物知識。**例（促發）**：清晰度影響約 150 ms 內、促發要到 300 ms 後 → 兩歷程分開。", "**限制**：峰是多來源相加，不是單一心理模組；空間定位差（逆問題）；需大量試次，眨眼、眼動、肌肉雜訊大。"]}, "16": {"a": "電生理把臉處理拆成知覺編碼、臉身分、人物知識，並顯示單一細胞傾向稀疏編碼。", "pts": ["**三層**：知覺編碼（五官配置）→ 臉身分（跨光線表情角度）→ 人物知識（可由名字、聲音觸發）。", "**單一細胞（猴下顳葉）**：多數細胞對一組臉有不同程度反應，非專屬某一張 → 反對極端**祖母細胞**。", "**人類手術記錄**：內側顳葉有對特定名人（含名字）高度敏感的神經元，但不可能測遍所有刺激 → 較合理是**稀疏編碼**。上顳溝細胞對視線、表情、頭部動作敏感 → 臉也是社會訊息。", "**ERP 時序**：N170（右後顳，臉結構，不管是不是名人）→ N250（熟悉臉身分）→ 晚期成分（臉與名字都影響，人物知識）。", "**裁決理論**：漫畫臉若增強 N170 → 效果在知覺編碼（誇大辨識特徵）而非記憶；促發只影響晚期 → 作用於人物知識。", "**限制**：ERP 難定位來源；單細胞抽樣少且多來自動物或特殊個案。"]}, "17": {"a": "TMS 檢驗重組區是否已成為「必要」；tDCS 以興奮性與後效研究可塑性如何被調整。", "pts": ["**可塑性**：經驗、感覺缺失或損傷後，功能分配、連線與興奮性改變；造影能看到重組後的活躍，卻不能證明有功能。", "**早盲者點字**：明眼人靠體感覺皮質；早盲者枕葉也活躍。TMS 干擾中枕葉 → 點字辨認下降，明眼人影響小 → 視覺皮質被徵用於精細觸覺與空間辨認。", "**其他例**：長期使用的身體部位代表區擴大；截肢／缺乏輸入的代表區縮小或被鄰區侵入 → 皮質地圖會隨使用與輸入競爭而變。", "**限制性**：接手的功能與原計算相近（視覺與點字都要高精度空間模式）；枕葉也可參與語言，非絕對但受原有連線約束。", "**tDCS**：陽極↑、陰極↓興奮性；刺激停止後的後效與突觸可塑性有關，適合研究學習。", "**限制**：TMS 影響範圍不易確定；tDCS 更不聚焦、效果依情境；效應小於自然腦傷。"]}, "18": {"a": "心身問題＝主觀心智與物質大腦是兩種東西還是同一件事；三種框架：二元論、雙重面向論、一元論。", "pts": ["**二元論（笛卡兒）**：心與身是兩種實體，交會在松果體；符合直覺，但非物質心靈如何推動神經元、如何被測量？認知神經科學通常不採用。", "**雙重面向論（斯賓諾莎式）**：心與腦是同一實在的兩種描述角度（第三人稱放電 vs 第一人稱害怕），像同一首歌的頻譜與旋律。", "**一元論／物理一元論**：心智由物質大腦產生，無獨立心靈；**化約論**較強版本預測心理概念終被神經概念取代（如燃素被氧化理論淘汰）。", "**現況**：不知道「工作記憶」「抑制」是什麼就無法設計神經實驗 → 現階段仍需心理層次理論；課程偏向一元論，但不等於可刪掉心理概念。"]}, "19": {"a": "不是；顱相學的錯在方法與理論，不在「功能有區域差異」這個直覺。", "pts": ["**顱相學主張**：①不同腦區負責不同能力 ②能力越強腦區越大、頂出頭骨，摸頭可測人格。①含專門化直覺，②無根據。", "**認神的支持**：Broca／Wernicke 病人、Penfield 皮質刺激與感覺動作地圖支持局部功能差異。", "**顱相學失敗處**：頭骨外形不反映腦區大小；先發明含糊能力（母愛、破壞性）再貼位置，缺乏可檢驗的認知理論與嚴謹實驗。", "**現代做法**：損傷、TMS、電生理、單細胞、造影**交叉驗證**；認知心理學先把能力拆成可操作歷程，再問腦網路如何實現。", "**風險**：「杏仁核＝恐懼中心」「前扣帶亮＝說謊」→ 新顱相學。基本感覺動作較專門化，語言記憶推理依賴跨區網路。"]}, "20": {"a": "神經元內部靠電、細胞之間靠化學、下游再轉回電：電→化學→電。", "pts": ["**靜息膜電位**：約 −70 mV，由離子分布不均、膜選擇性通透、鈉鉀幫浦維持。", "**漸進電位**：傳導物質→受體→離子通道開啟→EPSP（近閾值）／IPSP（遠離閾值）；做**空間加總**與**時間加總**。", "**動作電位**：軸突起始處過閾值 → 鈉通道開、鈉流入（**去極化**）→ 鈉通道失活、鉀外流（**再極化**）→ 可能超極化與**不應期**；**全有全無**，強度靠頻率；髓鞘＋**郎飛氏結**跳躍式傳導。", "**化學傳遞**：抵達終端 → 鈣通道開、鈣進入 → 囊泡融合釋放傳導物質 → 結合突觸後受體 → 再吸收／酶解／擴散清除。", "**比較**：漸進電位在樹突／細胞體、強弱可變、可興奮或抑制、會衰減；動作電位在軸突、全有全無、主動再生、不衰減。"]}, "21": {"a": "突觸傳遞：動作電位轉成化學訊號，下游神經元把興奮與抑制加總，過閾值才再放電——像即時投票。", "pts": ["**流程**：動作電位抵達終端 → 鈣通道開、鈣流入 → 囊泡與膜融合釋放傳導物質進**突觸間隙** → 結合突觸後受體 → 形成 EPSP／IPSP。", "**整合**：下游同時收成千上萬個輸入，做空間與時間加總；軸突起始處超過閾值才發出全有全無的動作電位。", "**學習**：常發生在突觸權重改變（同一輸入能造成多大的突觸後效果）。", "**電突觸**：gap junction 直接交換離子，快且易同步，但可調節性較差；大腦多數長距離與複雜計算仰賴化學突觸。"]}, "22": {"a": "神經元用放電頻率、放電時序與群體型樣編碼，資訊不在單發動作電位的大小，也通常不在孤立的祖母細胞。", "pts": ["**限制**：動作電位全有全無，不能靠高度表示強度。", "**率編碼**：每秒放電數＝刺激與偏好的符合程度；單細胞記錄畫**調諧曲線**（如下顳葉對特定臉、聽覺神經元對特定頻率、上顳溝對視線方向）。", "**時間編碼**：看何時放電與是否**同步**；同一光棒跨兩個感受野時兩區同步較高，兩條分開的光棒則否 → 特徵綁定的可能機制。", "**多少神經元代表一概念**：祖母細胞（高效但脆弱、無法證明）vs 完全分散（耗能）→ 證據較支持**稀疏分散式編碼**：少量神經元共同表示，每顆也參與相關概念。"]}, "23": {"a": "語音與音樂共用早期聲學分析，之後因目標不同而部分分流——不是「左腦語言、右腦音樂」。", "pts": ["**共用**：耳朵與早期聽覺皮質分析頻率、強度、時間變化；分化發生在後續如何組織成音素、詞或旋律、節拍。", "**雙重分離**：**純詞聾**（左顳葉聽覺語言網路）能說話、認得音樂與環境音，卻聽不懂詞；**CN**（雙側顳葉受損）認不出熟悉旋律，卻懂歌詞與人聲。", "**語音特殊機制**：類別知覺、McGurk 視聽整合、困難條件下運動表徵輔助。", "**音樂內部分離**：音高 vs 節奏（跟得上拍卻分不出錯音，或相反）；先天性失樂症偏音高；熟悉旋律辨認涉及音樂語意記憶（前顳葉）。", "**偏側化**：右半球偏音高與旋律輪廓、左半球偏快速時間與語言類別，但兩者皆依賴雙側網路。"]}, "24": {"a": "fMRI 可在高度受控、選項有限時分類腦活動型樣，但無法可靠測謊或讀出任意具體想法。", "pts": ["**傳統測謊機**：測心跳、呼吸、皮膚導電＝一般喚起；無辜者緊張、熟練者平靜 → 並未直接測謊。", "**fMRI 測謊**：說謊不是單一歷程（記真相、抑制、編造、監控、推測對方）涉及前額葉、前扣帶、記憶與心智理論網路 → 沒有「說謊區」；實驗無真實後果與動機；**基準率**低時偽陽性導致大量誤判。", "**讀心＝MVPA**：看一群體素的活動型樣；分類器先學已知刺激（臉／房子／鞋）的型樣，再判斷新試次。", "**限制**：是封閉選項分類，不是開放字幕；需同任務、同個人、足夠訓練資料；個別差異與概念表徵使開放想法無「字典」。", "**結論**：可粗略解碼類別、為無法行動的病人建立簡單溝通；不能可靠測真實謊言或讀具體私密思想。"]}, "25": {"a": "臉確實有相對專門的證據，但「為什麼特殊」有四種解釋，可能共同作用。", "pts": ["**特殊性證據**：梭狀回臉區 **FFA**；ERP **N170** 對臉特別敏感；**臉盲**者看得到五官與一般物體卻認不出家人。", "**①任務難度**：臉彼此相似、需細微辨別——但調成相近難度後臉盲者仍特別差，難度不足以解釋。", "**②整體處理**：臉重配置關係；臉**倒置效應**破壞整體處理。", "**③視覺專家說**：FFA 處理熟練的個體層次辨別；**Greebles** 專家訓練、汽車／鳥類專家可增加臉區與 N170 反應。", "**④領域特定說**：演化與社會重要性，先天偏好（嬰兒偏好臉狀配置）；但臉區仍回應其他物體，強版本不易成立。", "**結論**：先天偏好＋經驗調整＋整體處理＋任務需求的組合，不宜只用單一原因。"]}, "26": {"a": "單細胞記錄揭露聽覺皮質的音調地圖、核心→帶區階層、音量與位置調諧，以及前 what／後 where 分流。", "pts": ["**音調拓樸**：耳蝸分頻率，聽覺皮質保留有序頻率地圖——相近頻率由相近神經元表示（視覺存位置、聽覺存頻率）。", "**階層處理**：核心區神經元頻率窄；外圍帶區整合多個輸入，對寬頻組合、頻率變化方向、猴子叫聲等複雜聲音更強 → 如視覺從邊緣到複雜形狀。", "**多維編碼**：神經元可同時受音量與位置影響，非單純代表一個特徵。", "**what／where**：獼猴前方帶區對叫聲身分選擇性高、不受位置影響；後方帶區對位置最敏感。", "**限制**：侵入性、多為動物、細胞抽樣少 → 需與人類造影、病灶、行為驗證。"]}, "27": {"a": "部分不同：音樂與其他聲音共用早期聽覺分析，之後在音高、節奏、熟悉旋律記憶部分專門化，並連動動作與一般獎賞系統。", "pts": ["**與語音雙重分離**：純詞聾聽不懂口語仍可辨音樂；失樂症（CN）認不出旋律但理解口語歌詞。", "**音樂內部可分解**（Peretz & Coltheart）：音高路徑（旋律輪廓、音程、調性）vs 時間路徑（節拍、節奏）；可只損其一；先天性失樂症以音高辨識困難為核心。", "**動作系統**：聽規律節拍即使不動也啟動前運動皮質、輔助動作區、小腦、基底核（預測節拍≈準備動作時點）。", "**情緒獎賞**：熟悉段落的期待與高潮使用一般獎賞與情緒網路，非音樂專屬快樂中心。", "**偏側化**：右半球偏細緻音高與旋律、左半球偏快速時間，但音樂成分分布在雙側網路。"]}, "28": {"a": "團體研究能找病灶熱點與必要節點，但須控制分組異質性、病灶共變、遠距效應與過度定位。", "pts": ["**分組三法**：①依臨床症候群（方便但同組內異質）②依認知症狀（貼近理論但成因不同）③依解剖位置（可檢驗造影預測，但漏掉其他節點）。", "**病灶症狀映射**：逐體素比較，看某體素受損是否與行為分數系統相關，畫出統計熱點。", "**限制**：①血管分布使鄰區一起受損，易誤認關鍵點 ②結構影像不一定顯示功能失效範圍 ③**遠距效應（diaschisis）**使遠處區域暫時低下 ④過度解釋（X 受損使 F 變差≠F 存放於 X）→ 新顱相學。", "**互補**：團體提供位置關聯、變異與統計穩定；個案提供精細分離與錯誤型態。"]}, "29": {"a": "由下往上：後腦維持生命與動作精確、中腦快速定向與動作調節、前腦高階整合與動機目標行為；三者持續互相連接。", "pts": ["**前腦**：大腦皮質（知覺、語言、記憶、決策）；基底核（動作、習慣、技能、獎賞學習；帕金森氏症）；邊緣系統（杏仁核＝威脅情緒、海馬迴＝新情節記憶、扣帶皮質＝衝突動機）；**視丘**（感覺中繼，LGN／MGN，受注意調節）；**下視丘**（體內平衡、自律神經、內分泌）。", "**中腦**：**上丘**（視聽觸整合，快速定向眼頭）、**下丘**（聽覺中繼）、**黑質**（多巴胺，與基底核相連，流失→帕金森氏症）。", "**後腦**：**延髓**（呼吸、心跳、吞嚥）、**橋腦**（連結大腦、小腦與腦幹，參與睡眠喚醒）、**小腦**（動作時序、協調、誤差修正與學習；受損→搖晃、不準）。"]}, "30": {"a": "兩者互相需要：不同層次的限制彼此校正，互相取代都不成立。", "pts": ["**認知心理學不依賴腦也成功**（反應時間、錯誤率、促發建立資訊處理模型）；但腦資料可成新的依變項，並**區分預測相同行為的不同模型**。", "**例**：改變大小寫，左梭狀回仍出現重複抑制 → 該階段已轉成抽象詞形表徵（不只告訴「哪裡」，也告訴表徵性質）。", "**硬體／軟體比喻不完整**：大腦的演化、發展、連線速度與可塑性限制資訊如何處理與受損後如何代償。", "**神經科學需要認知心理學**：掃描器、電極不會自己標示「記憶提取」「衝突監控」；需認知理論定義作業與控制條件，否則退化為看哪裡亮再貼標籤（新顱相學）。", "**結論**：心理概念是否終被化約仍無定論，但現階段兩種語言都不可少。"]}};
/* ============ UI ============ */
const AUDIO={};
let audRate=1;
let curQ=1,curS=0,timer=null,tab='q';
const nSteps=q=>q.scenes.length+2;
const bold=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
function buildNav(filter=''){
  let h=`<input id="qsearch" placeholder="搜尋題目…" value="${filter}">`;
  GROUPS.forEach(([name,list])=>{
    const items=list.filter(n=>!filter||qTitle(n).includes(filter)||String(n)===filter||('第'+n+'題').includes(filter));
    if(!items.length)return;
    h+=`<h3>${name}</h3>`+items.map(n=>`<a data-q="${n}" class="${tab==='q'&&n===curQ?'on':''}"><b>${String(n).padStart(2,'0')}</b><span>${qTitle(n)}</span></a>`).join('');
  });
  $('#nav').innerHTML=h;
  const inp=$('#qsearch');inp.oninput=()=>{buildNav(inp.value.trim());const i=$('#qsearch');i.focus();i.setSelectionRange(i.value.length,i.value.length)};
}
function legendHTML(q){
  const L=[...(q.legend||[])];{const used=new Set();q.scenes.forEach(s=>(s.paths||[]).forEach(p=>PATHS[p]&&used.add(PATHS[p].k)));['ven','dor'].forEach(k=>used.has(k)&&!L.includes(k)&&L.push(k))}
  const names={vis:'視覺',aud:'聽覺',mot:'動作／運動輸出',lang:'語言／多感官',par:'背側(MT/頂葉)',ven:'腹側 what 路徑（綠）',dor:'背側 where／how 路徑（紅）',lim:'邊緣／情緒',fore:'前腦',midb:'中腦',hind:'後腦'};
  let h=L.map(k=>`<span><i class="ln" style="background:var(--${k})"></i>${names[k]||k}</span>`).join('');
  if((q.view==='brain'||q.scenes.some(s=>s.view==='brain'))) h+=`<span><i style="background:var(--sub);opacity:.5"></i>虛線＝深層結構（透明腦）</span><span>實線動畫箭頭＝傳導路徑</span>`;
  return h;
}
function selectQ(n,s=0){
  stopPlay();curQ=n;curS=s;tab='q';setTab('q');
  const q=qByN(n);
  $('#qnum').textContent='第 '+String(n).padStart(2,'0')+' 題';$('#qtitle').textContent=q.title;$('#qorig').textContent='原題 '+q.orig;
  $('#legend').innerHTML=legendHTML(q);
  $('#one').innerHTML=`<div class="lbl">一句話收束</div>${q.one}`;
  {const box=$('#qaudio'),au=$('#aud'),u=AUDIO[n];au.pause();if(u){box.classList.remove('hidden');if(au.dataset.n!=String(n)){au.src=u;au.dataset.n=n}au.defaultPlaybackRate=audRate;au.playbackRate=audRate}else{box.classList.add('hidden');au.removeAttribute('src')}}
  $('#pills').innerHTML=Array.from({length:nSteps(q)},(_,i)=>`<button class="pill${i>=q.scenes.length?' txt':''}" data-s="${i}" title="${i===q.scenes.length?'詳答總覽':i>q.scenes.length?'濃縮申論':''}">${i+1}</button>`).join('');
  $('#rinfo').classList.add('hidden');
  buildNav($('#qsearch')?$('#qsearch').value.trim():'');
  history.replaceState(null,'','#q'+n+(s?'.'+s:''));
  drawStep();
  document.title=`第${n}題 ${q.title}｜認知神經科學圖解`;
}
function drawStep(){
  const q=qByN(curQ),n=q.scenes.length,tot=nSteps(q),st=$('#stage'),rd=$('#reader');
  const txt=curS>=n;
  rd.classList.toggle('hidden',!txt);$('#stagewrap').classList.toggle('hidden',txt);
  document.querySelectorAll('.pill').forEach((b,i)=>{b.classList.toggle('on',i===curS);b.classList.toggle('done',i<curS)});
  $('#prog').textContent=`${curS+1} / ${tot}`;
  $('#prev').disabled=curS===0&&curQ===1;$('#next').textContent=curS===tot-1?(curQ<30?'下一題 →':'完成'):'下一步 →';
  if(txt){
    const b=BRIEF[curQ],f=FULL[curQ];
    if(curS===n){
      rd.innerHTML=`<h3>詳答總覽</h3><div class="sub">第 ${curQ} 題・原題 ${q.orig}・完整作答（${f.join('').length} 字）</div>`+f.map(p=>`<p>${esc(p)}</p>`).join('');
      $('#stepcard').innerHTML=`<div class="lbl">步驟 ${curS+1} / ${tot}</div><h4>詳答總覽</h4><p>前面的圖解是在「看位置與路徑」；這一步把完整答案從頭讀一遍，把圖上的結構放回論證裡。</p>`;
    }else{
      rd.innerHTML=`<h3>濃縮申論回答</h3><div class="sub">第 ${curQ} 題・原題 ${q.orig}・考場可直接展開的骨架</div><div class="ans">${bold(b.a)}</div><ol>${b.pts.map(x=>`<li>${bold(x)}</li>`).join('')}</ol>`;
      $('#stepcard').innerHTML=`<div class="lbl">步驟 ${curS+1} / ${tot}</div><h4>濃縮申論回答</h4><p>先寫粗體結論，再依序展開要點。要點順序就是建議的作答順序。</p>`;
    }
    $('#locate').innerHTML='';$('#locate').classList.add('hidden');
    history.replaceState(null,'','#q'+curQ+(curS?'.'+curS:''));
    return;
  }
  $('#locate').classList.remove('hidden');
  const sc=q.scenes[curS];
  st.setAttribute('viewBox',sc.vb||'0 0 800 520');
  st.innerHTML=renderScene(sc,q);
  $('#stepcard').innerHTML=`<div class="lbl">步驟 ${curS+1} / ${tot}</div><h4>${esc(sc.t)}</h4><p>${esc(sc.d)}</p>`;
  // 位置速查
  const v=sc.view||q.view,ids=(sc.hl||[]).filter(id=>regOf(id)&&v==='brain');
  const ps=(sc.paths||[]).filter(p=>PATHS[p]);
  let h='';
  if(v==='brain'&&(ids.length||ps.length)){
    h+=`<div class="lbl">本步驟涉及的結構（點擊看位置與功能）</div><div class="chips">`+ids.map(id=>{const r=regOf(id);const c=r.g?colOf(r.g):'var(--sub)';return `<button class="chip" data-reg="${id}"><span class="dot" style="background:${c}"></span>${r.n.split('（')[0]}</button>`}).join('')+`</div>`;
    if(ps.length)h+=`<div class="lbl" style="margin-top:10px">傳導路徑</div>`+ps.map(p=>`<div class="pathl"><i style="background:var(${PK[PATHS[p].k]})"></i>${PATHS[p].nm}${(sc.blocked||[]).includes(p)?'　<b style="color:var(--lim)">（被阻斷）</b>':''}</div>`).join('');
  }else if(v==='brain'){h+=`<div class="lbl">位置速查</div><p style="font-size:13.5px;color:var(--mute)">此步驟為概念說明；仍可點圖上任何結構看位置與功能。</p>`}
  else if(v==='flow'){h+=`<div class="lbl">提示</div><p style="font-size:13.5px;color:var(--mute)">高亮的方塊與箭頭是目前這一步的重點，其餘淡化。</p>`}
  else h+=`<div class="lbl">提示</div><p style="font-size:13.5px;color:var(--mute)">${v==='hrf'?'曲線上橘色圓點為本步驟標記。':v==='erp'||v==='erpavg'?'時間窗與標記的峰值對應本步驟。':v==='neuron'?'橘色發光處為本步驟的結構／電位階段。':'點選或切換步驟查看。'}</p>`;
  $('#locate').innerHTML=h;
  history.replaceState(null,'','#q'+curQ+(curS?'.'+curS:''));
}
function go(d){
  const q=qByN(curQ);
  if(d>0){if(curS<nSteps(q)-1){curS++;drawStep()}else if(curQ<30){selectQ(curQ+1)}else stopPlay()}
  else{if(curS>0){curS--;drawStep()}else if(curQ>1){const p=qByN(curQ-1);selectQ(curQ-1,nSteps(p)-1)}}
}
function stopPlay(){if(timer){clearInterval(timer);timer=null}$('#play').textContent='▶ 自動播放'}
function togglePlay(){if(timer){stopPlay();return}$('#play').textContent='⏸ 暫停';timer=setInterval(()=>{const q=qByN(curQ);if(curS>=q.scenes.length-1){stopPlay();return}go(1)},5200)}
function showReg(id,box){
  const r=regOf(id);if(!r)return;
  const used=[...(USE[id]||[])].sort((a,b)=>a-b);
  const c=r.g?colOf(r.g):'var(--sub)';
  const el=$(box||'#rinfo');el.classList.remove('hidden');el.style.borderLeftColor=c;
  el.innerHTML=`<div class="rt">${r.n}<small>${r.en}</small></div><dl><dt>位置</dt><dd>${r.loc}</dd><dt>功能</dt><dd>${r.fn}</dd><dt>出現於</dt><dd>${used.length?used.map(n=>`<button class="chip" data-goq="${n}">第${n}題</button>`).join(' '):'—'}</dd></dl>`;
}
function setTab(t){
  tab=t;['q','atlas','lines'].forEach(k=>$('#v-'+k).classList.toggle('hidden',k!==t));
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t));
  $('#nav').style.display=t==='q'?'':'none';$('#app').style.gridTemplateColumns=t==='q'&&innerWidth>980?'':'1fr';
  if(t==='atlas')drawAtlas();if(t==='lines')drawLines();
}
/* —— 圖鑑 —— */
let aSel=null,aGroup='all';
function drawAtlas(){
  const gs=['all','vis','aud','lang','mot','par','cog','lim','sub','midb','hind'];
  const gname={all:'全部',vis:'視覺',aud:'聽覺',lang:'語言／多感官',mot:'動作',par:'背側／頂葉',cog:'高階認知',lim:'邊緣／情緒',sub:'皮質下',midb:'中腦',hind:'後腦'};
  $('#gf').innerHTML=gs.map(g=>`<button class="${g===aGroup?'on':''}" data-ag="${g}">${gname[g]}</button>`).join('');
  const inG=r=>aGroup==='all'||r.g===aGroup;
  let s=defs()+baseBrain();
  R.forEach(r=>{s+=regionG(r,aSel===r.id?'on':(inG(r)&&aGroup!=='all'?'on':(aGroup!=='all'?'dim':'norm')))});
  R.forEach(r=>{if((aGroup!=='all'&&inG(r)&&!r.nolabel)||aSel===r.id)s+=regionLabel(r)});
  if(aGroup!=='all'){const ks=new Set();R.filter(inG).forEach(r=>{(({vis:['vis','ven'],aud:['aud','ven','dor'],lang:['lang'],mot:['mot','dor'],par:['par','dor']})[r.g]||[]).forEach(k=>ks.add(k))});
    Object.entries(PATHS).forEach(([id,p])=>{if(ks.has(p.k)){const d=smooth(p.pts);s+=`<path class="pbase" d="${d}" style="stroke:var(${PK[p.k]})"/><path class="pflow" d="${d}" style="stroke:var(${PK[p.k]})" marker-end="url(#m-${p.k})"/>`}})}
  $('#atlasSvg').innerHTML=s.replace(/id="([^"]+)"/g,'id="$1A"').replace(/url\(#([^)]+)\)/g,'url(#$1A)');
  $('#rlist').innerHTML=[...LOBES,...R].filter(r=>!r.lx!==undefined).filter(r=>aGroup==='all'||r.g===aGroup).map(r=>`<button class="chip" data-reg="${r.id}"><span class="dot" style="background:${r.g?colOf(r.g):'var(--sub)'}"></span>${r.n.split('（')[0]}</button>`).join('');
  if(aSel)showReg(aSel,'#aInfo');
}
function drawLines(){
  $('#linesBox').innerHTML=LINES.map((l,i)=>`<div class="card"><h4><b>${i+1}</b>${l[0]}</h4><p>${l[1]}</p><div class="chips" style="margin-top:10px">${l[2].map(n=>`<button class="chip" data-goq="${n}" title="${qTitle(n)}">${String(n).padStart(2,'0')} ${qTitle(n).slice(0,10)}${qTitle(n).length>10?'…':''}</button>`).join('')}</div></div>`).join('');
  $('#scaleFig').innerHTML=scaleSVG(document.querySelector('[data-ax].on').dataset.ax,[]);
}

/* —— 事件 —— */
document.addEventListener('click',e=>{
  const rb=e.target.closest('[data-rate]');if(rb){audRate=+rb.dataset.rate;$('#aud').defaultPlaybackRate=audRate;$('#aud').playbackRate=audRate;document.querySelectorAll('[data-rate]').forEach(x=>x.classList.toggle('on',x===rb));return}
  const t=e.target.closest('[data-q],[data-s],[data-reg],[data-goq],[data-ag],[data-ax],[data-tab],#prev,#next,#play,#menuBtn,.reg');if(!t)return;
  if(t.dataset.q){selectQ(+t.dataset.q);$('#nav').classList.remove('open')}
  else if(t.dataset.s!==undefined){stopPlay();curS=+t.dataset.s;drawStep()}
  else if(t.dataset.goq){selectQ(+t.dataset.goq);scrollTo(0,0)}
  else if(t.dataset.ag){aGroup=t.dataset.ag;aSel=null;drawAtlas()}
  else if(t.dataset.ax){document.querySelectorAll('[data-ax]').forEach(b=>b.classList.toggle('on',b===t));drawLines()}
  else if(t.dataset.tab){stopPlay();if(t.dataset.tab==='q')selectQ(curQ,curS);else setTab(t.dataset.tab)}
  else if(t.id==='prev'){stopPlay();go(-1)}
  else if(t.id==='next'){stopPlay();go(1)}
  else if(t.id==='play')togglePlay();
  else if(t.id==='menuBtn')$('#nav').classList.toggle('open');
  else if(t.dataset.reg||t.classList.contains('reg')){
    const id=t.dataset.reg||t.dataset.id;
    if(tab==='atlas'){aSel=id;drawAtlas()}else showReg(id);
  }
});
document.addEventListener('mousemove',e=>{
  const g=e.target.closest&&e.target.closest('.reg'),tip=$('#tip');
  if(g){const r=regOf(g.dataset.id);if(r){tip.textContent=r.n;tip.style.display='block';tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY+14)+'px';return}}
  tip.style.display='none';
});
document.addEventListener('keydown',e=>{
  if(tab!=='q'||e.target.tagName==='INPUT')return;
  if(e.key==='ArrowRight'){stopPlay();go(1)}else if(e.key==='ArrowLeft'){stopPlay();go(-1)}
  else if(e.key==='ArrowDown'&&curQ<30){e.preventDefault();selectQ(curQ+1)}else if(e.key==='ArrowUp'&&curQ>1){e.preventDefault();selectQ(curQ-1)}
});
window.addEventListener('resize',()=>setTab(tab));

const m=location.hash.match(/#q(\d+)(?:\.(\d+))?/);
buildNav();selectQ(m?Math.min(30,Math.max(1,+m[1])):1,m&&m[2]?Math.min(+m[2],nSteps(qByN(Math.min(30,Math.max(1,+m[1]))))-1):0);
</script>

</body></html>
