<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" font-family="PingFang TC, Noto Sans TC, sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect width="400" height="260" rx="18" fill="#fffdf7"/>
<text x="200" y="20" font-size="13" font-weight="700" fill="#2b1d14" text-anchor="middle">音調拓樸：頻率與皮質位置整齊對應</text><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#e8a3b6"/><stop offset=".5" stop-color="#8cbbd6"/><stop offset="1" stop-color="#e8a3b6"/></linearGradient></defs><rect x="30" y="44" width="340" height="116" rx="22" fill="#f6dcc2" stroke="#2b1d14" stroke-width="3"/><rect x="62" y="66" width="276" height="72" rx="14" fill="url(#g)" stroke="#2b1d14" stroke-width="3"/><g font-size="12" font-weight="700" fill="#2b1d14" text-anchor="middle"><text x="84" y="98">外側</text><text x="84" y="114" font-size="11">高頻</text><text x="200" y="98">中央（內側）</text><text x="200" y="114" font-size="11">低頻</text><text x="316" y="98">外側</text><text x="316" y="114" font-size="11">高頻</text></g><text x="200" y="60" font-size="10" font-weight="700" fill="#2b1d14" text-anchor="middle">A2：belt 與 parabelt（複雜音）</text><text x="200" y="152" font-size="10" fill="#2b1d14" text-anchor="middle">A1 核心區 core</text><text x="200" y="190" font-size="12" fill="#2b1d14" text-anchor="middle">頻率相近的聲音，由空間上相近的神經元表徵</text><text x="200" y="212" font-size="11" font-weight="700" fill="#c0504d" text-anchor="middle">視覺對應的是視網膜拓樸（位置對位置）</text><text x="200" y="240" font-size="9" fill="#6b5a4a" text-anchor="middle">排列是示意；投影片寫 high, low, high</text>
</svg>
