<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" font-family="PingFang TC, Noto Sans TC, sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect width="400" height="260" rx="18" fill="#fffdf7"/>
<text x="200" y="22" font-size="14" font-weight="700" fill="#2b1d14" text-anchor="middle">功能定位 vs 分散式 vs 折衷</text>
<g stroke="#2b1d14" stroke-width="3">
<ellipse cx="68" cy="100" rx="52" ry="40" fill="#fffdf7"/><ellipse cx="200" cy="100" rx="52" ry="40" fill="#fffdf7"/><ellipse cx="332" cy="100" rx="52" ry="40" fill="#fffdf7"/></g>
<g stroke="none"><path d="M44,86 L68,86 L68,114 L44,114 Z" fill="#f2b48a"/><path d="M78,84 L96,84 L96,118 L78,118 Z" fill="#8cbbd6"/>
<circle cx="170" cy="86" r="9" fill="#f2b48a"/><circle cx="196" cy="116" r="9" fill="#9ccaa0"/><circle cx="226" cy="90" r="9" fill="#8cbbd6"/><circle cx="212" cy="116" r="9" fill="#e8a3b6"/><circle cx="184" cy="100" r="9" fill="#e8a3b6"/>
<circle cx="312" cy="78" r="8" fill="#f2b48a"/><circle cx="352" cy="82" r="8" fill="#8cbbd6"/><circle cx="306" cy="118" r="8" fill="#9ccaa0"/></g>
<g stroke="#2b1d14" stroke-width="2" fill="none"><path d="M170,86 L196,116 L226,90 M184,100 L212,116 M170,86 L184,100 M196,116 L212,116"/><path d="M320,86 L332,100 L346,86 M332,100 L312,116 M332,100 L332,100"/></g>
<circle cx="332" cy="100" r="11" fill="#e8c46a" stroke="#2b1d14" stroke-width="2"/>
<g font-size="13" font-weight="700" fill="#2b1d14" text-anchor="middle"><text x="68" y="170">定位</text><text x="200" y="170">分散（網絡）</text><text x="332" y="170">折衷</text></g>
<g font-size="10" fill="#6b5a4a" text-anchor="middle"><text x="68" y="184">localization</text><text x="200" y="184">distributed</text><text x="332" y="184">Goldstein</text></g>
<g font-size="11" fill="#2b1d14" text-anchor="middle"><text x="68" y="204">一區一功能</text><text x="68" y="219">Broca、Wernicke</text><text x="200" y="204">很多節點一起算</text><text x="200" y="219">Lashley</text><text x="332" y="204">周邊偏定位</text><text x="332" y="219">中央多功、動態</text></g>
<text x="200" y="246" font-size="11" fill="#c0504d" font-weight="700" text-anchor="middle">課堂結論：互聯，但特定腦區在特定功能上更關鍵</text>
