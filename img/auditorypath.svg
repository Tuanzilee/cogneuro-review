<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" font-family="PingFang TC, Noto Sans TC, sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect width="400" height="260" rx="18" fill="#fffdf7"/>
<text x="200" y="20" font-size="13" font-weight="700" fill="#2b1d14" text-anchor="middle">聽覺路徑：耳朵到聽覺皮質</text><rect x="14" y="40" width="100" height="50" rx="10" fill="#cfe0f0" stroke="#2b1d14" stroke-width="2.5"/><text x="64.0" y="65.0" font-size="12" font-weight="700" fill="#2b1d14" text-anchor="middle">耳朵</text><text x="64.0" y="79.0" font-size="9" fill="#2b1d14" text-anchor="middle">耳蝸</text><path d="M116,65 L138,65" stroke="#2b1d14" stroke-width="2.5" fill="none"/><path d="M132,60 L138,65 L132,70" stroke="#2b1d14" stroke-width="2.5" fill="none"/><rect x="140" y="40" width="110" height="50" rx="10" fill="#cfe6cf" stroke="#2b1d14" stroke-width="2.5"/><text x="195.0" y="65.0" font-size="12" font-weight="700" fill="#2b1d14" text-anchor="middle">耳蝸神經核</text><text x="195.0" y="79.0" font-size="9" fill="#2b1d14" text-anchor="middle">cochlear nuclei</text><path d="M252,65 L274,65" stroke="#2b1d14" stroke-width="2.5" fill="none"/><path d="M268,60 L274,65 L268,70" stroke="#2b1d14" stroke-width="2.5" fill="none"/><rect x="276" y="40" width="110" height="50" rx="10" fill="#f6dcc2" stroke="#2b1d14" stroke-width="2.5"/><text x="331.0" y="65.0" font-size="12" font-weight="700" fill="#2b1d14" text-anchor="middle">下丘</text><text x="331.0" y="79.0" font-size="9" fill="#2b1d14" text-anchor="middle">中腦 inferior colliculus</text><path d="M330,92 L330,110 L70,110 L70,128" stroke="#2b1d14" stroke-width="2.5" fill="none"/><path d="M64,122 L70,130 L76,122" stroke="#2b1d14" stroke-width="2.5" fill="none"/><rect x="14" y="132" width="110" height="50" rx="10" fill="#e8d5f0" stroke="#2b1d14" stroke-width="2.5"/><text x="69.0" y="157.0" font-size="12" font-weight="700" fill="#2b1d14" text-anchor="middle">內側膝狀核 MGN</text><text x="69.0" y="171.0" font-size="9" fill="#2b1d14" text-anchor="middle">視丘 thalamus</text><path d="M126,157 L148,157" stroke="#2b1d14" stroke-width="2.5" fill="none"/><path d="M142,152 L148,157 L142,162" stroke="#2b1d14" stroke-width="2.5" fill="none"/><rect x="150" y="132" width="110" height="50" rx="10" fill="#e8a3b6" stroke="#2b1d14" stroke-width="2.5"/><text x="205.0" y="157.0" font-size="12" font-weight="700" fill="#2b1d14" text-anchor="middle">A1 初級聽覺皮質</text><text x="205.0" y="171.0" font-size="9" fill="#2b1d14" text-anchor="middle">赫氏迴、核心區</text><path d="M262,157 L284,157" stroke="#2b1d14" stroke-width="2.5" fill="none"/><path d="M278,152 L284,157 L278,162" stroke="#2b1d14" stroke-width="2.5" fill="none"/><rect x="286" y="132" width="100" height="50" rx="10" fill="#e8a3b6" stroke="#2b1d14" stroke-width="2.5"/><text x="336.0" y="157.0" font-size="12" font-weight="700" fill="#2b1d14" text-anchor="middle">A2 次要聽覺皮質</text><text x="336.0" y="171.0" font-size="9" fill="#2b1d14" text-anchor="middle">belt、parabelt</text><text x="200" y="208" font-size="11" font-weight="700" fill="#c0504d" text-anchor="middle">聽覺神經路徑沒有清楚的大腦側化</text><text x="200" y="228" font-size="11" fill="#2b1d14" text-anchor="middle">MGN 之於聽覺，就像 LGN 之於視覺；下丘＝「上視下聽」的下</text>
</svg>
