<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" font-family="PingFang TC, Noto Sans TC, sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect width="400" height="260" rx="18" fill="#fffdf7"/>
<text x="200" y="18" font-size="13" font-weight="700" fill="#2b1d14" text-anchor="middle">範疇知覺（理想化的結果）</text>
<g stroke="#2b1d14" stroke-width="2" fill="none"><path d="M40,34 L40,104 L184,104"/><path d="M220,34 L220,104 L364,104"/></g>
<path d="M44,44 C90,44 100,44 108,52 C116,60 118,92 126,98 C140,100 170,100 180,100" fill="none" stroke="#4a86a6" stroke-width="4"/>
<path d="M224,92 C260,92 270,90 282,80 C288,60 292,50 298,40 C304,50 308,70 320,82 C330,90 350,92 360,92" fill="none" stroke="#e08a4f" stroke-width="4"/>
<path d="M116,34 L116,104 M290,34 L290,104" stroke="#c0504d" stroke-width="2" stroke-dasharray="4 4"/>
<g font-size="10" fill="#2b1d14" text-anchor="middle"><text x="112" y="30" fill="#c0504d" font-weight="700">類別邊界</text><text x="112" y="28" font-size="0"> </text><text x="290" y="30" fill="#c0504d" font-weight="700">類別邊界</text></g>
<g font-size="10" fill="#2b1d14" text-anchor="middle"><text x="112" y="120" font-weight="700">辨認：S 形</text><text x="112" y="133" font-size="9">ba ← 聲音連續變化 → da</text><text x="292" y="120" font-weight="700">辨別：跨界時最準</text><text x="292" y="133" font-size="9">同一類別內分不出差異</text></g>
<rect x="14" y="146" width="372" height="98" rx="12" fill="#fffdf7" stroke="#2b1d14" stroke-width="2.5"/>
<g font-size="11" fill="#2b1d14" text-anchor="middle"><text x="200" y="166" font-weight="700">不同類別之間比同類別之內更能分辨</text><text x="200" y="184">閱讀障礙兒童：跨類別辨別較差、類別內較好</text><text x="200" y="202">例：日語母語者難分英文 /r/ 與 /l/（兩者都被聽成日語 /r/）</text><text x="200" y="224" font-size="9" fill="#6b5a4a">類別建立後不容易改變；圖形取自延伸閱讀的理想化描述，非實測資料</text></g>
</svg>
