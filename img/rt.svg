<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" font-family="PingFang TC, Noto Sans TC, sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect width="400" height="260" rx="18" fill="#fffdf7"/>
<text x="200" y="22" font-size="14" font-weight="700" fill="#2b1d14" text-anchor="middle">反應時間（RT）與加法因素法</text>
<g stroke="#2b1d14" stroke-width="3"><rect x="20" y="40" width="64" height="34" rx="8" fill="#e7e1d3"/><rect x="100" y="40" width="64" height="34" rx="8" fill="#f2b48a"/><rect x="180" y="40" width="64" height="34" rx="8" fill="#8cbbd6"/></g>
<g font-size="22" font-weight="700" fill="#2b1d14" text-anchor="middle"><text x="52" y="66">+</text></g>
<g font-size="12" font-weight="700" fill="#2b1d14" text-anchor="middle"><text x="132" y="62">刺激</text><text x="212" y="62">按鍵</text></g>
<g font-size="10" fill="#6b5a4a" text-anchor="middle"><text x="52" y="90">凝視點</text><text x="132" y="90">是臉嗎？</text><text x="212" y="90">Yes / No</text></g>
<path d="M100,104 L244,104" stroke="#c0504d" stroke-width="3"/><path d="M100,98 L100,110 M244,98 L244,110" stroke="#c0504d" stroke-width="3"/>
<text x="172" y="124" font-size="12" font-weight="700" fill="#c0504d" text-anchor="middle">RT：刺激開始 → 按鍵（毫秒）</text>
<text x="300" y="58" font-size="10" fill="#2b1d14">看正確的 Yes 試次</text><text x="300" y="73" font-size="10" fill="#2b1d14">No 可檢查有沒有認真</text>
<g stroke="#2b1d14" stroke-width="2.5"><rect x="20" y="146" width="120" height="22" rx="6" fill="#8cbbd6"/><rect x="20" y="176" width="200" height="22" rx="6" fill="#8cbbd6"/></g>
<g font-size="10" fill="#2b1d14"><text x="150" y="162">少項目：RT 短</text><text x="230" y="192">多項目：RT 長</text></g>
<text x="200" y="224" font-size="11" font-weight="700" fill="#2b1d14" text-anchor="middle">條件間的 RT 差＝額外處理階段的成本（Sternberg, 1969）</text>
<text x="200" y="244" font-size="10" fill="#6b5a4a" text-anchor="middle">RT 是行為指標，不是直接量到的神經電位</text>
</svg>
