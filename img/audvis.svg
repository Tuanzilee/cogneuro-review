<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" font-family="PingFang TC, Noto Sans TC, sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect width="400" height="260" rx="18" fill="#fffdf7"/>
<text x="200" y="20" font-size="13" font-weight="700" fill="#2b1d14" text-anchor="middle">聽覺系統 vs 視覺系統</text><rect x="12" y="32" width="376" height="212" rx="12" fill="#fffdf7" stroke="#2b1d14" stroke-width="2.5"/><rect x="152" y="34" width="116" height="30" fill="#f6dcc2"/><rect x="270" y="34" width="116" height="30" fill="#cfe0f0"/><g stroke="#2b1d14" stroke-width="2"><path d="M12,64 L388,64 M152,32 L152,244 M270,32 L270,244"/><path d="M12,100 L388,100"/><path d="M12,136 L388,136"/><path d="M12,172 L388,172"/><path d="M12,208 L388,208"/></g><g font-size="12" font-weight="700" fill="#2b1d14" text-anchor="middle"><text x="210" y="54">聽覺</text><text x="328" y="54">視覺</text></g><text x="82" y="86" font-size="10" font-weight="700" fill="#2b1d14" text-anchor="middle">丘腦到皮質</text><text x="210" y="86" font-size="11" fill="#2b1d14" text-anchor="middle">MGN → A1</text><text x="328" y="86" font-size="11" fill="#2b1d14" text-anchor="middle">LGN → V1</text><text x="82" y="122" font-size="10" font-weight="700" fill="#2b1d14" text-anchor="middle">早期處理的組織原則</text><text x="210" y="122" font-size="11" fill="#2b1d14" text-anchor="middle">音調拓樸（頻率）</text><text x="328" y="122" font-size="11" fill="#2b1d14" text-anchor="middle">視網膜拓樸（位置）</text><text x="82" y="158" font-size="10" font-weight="700" fill="#2b1d14" text-anchor="middle">敏感度</text><text x="210" y="158" font-size="11" fill="#2b1d14" text-anchor="middle">時間 > 空間</text><text x="328" y="158" font-size="11" fill="#2b1d14" text-anchor="middle">空間 > 時間</text><text x="82" y="194" font-size="10" font-weight="700" fill="#2b1d14" text-anchor="middle">特徵專化的證據</text><text x="210" y="194" font-size="11" fill="#2b1d14" text-anchor="middle">較少</text><text x="328" y="194" font-size="11" fill="#2b1d14" text-anchor="middle">顏色、移動很多</text><text x="82" y="230" font-size="10" font-weight="700" fill="#2b1d14" text-anchor="middle">what 與 where／how 路徑</text><text x="210" y="230" font-size="11" fill="#2b1d14" text-anchor="middle">有證據</text><text x="328" y="230" font-size="11" fill="#2b1d14" text-anchor="middle">有證據</text>
</svg>
