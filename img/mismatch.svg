<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" font-family="PingFang TC, Noto Sans TC, sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect width="400" height="260" rx="18" fill="#fffdf7"/>
<text x="200" y="22" font-size="14" font-weight="700" fill="#2b1d14" text-anchor="middle">造影 vs 損傷：兩邊的結果對得上嗎？</text>
<g font-size="12" font-weight="700" fill="#2b1d14" text-anchor="middle"><text x="168" y="46">損傷有影響</text><text x="296" y="46">損傷沒影響</text></g>
<g font-size="12" font-weight="700" fill="#2b1d14" text-anchor="end"><text x="98" y="104">造影有活動</text><text x="98" y="190">造影沒活動</text></g>
<g stroke="#2b1d14" stroke-width="2.5"><rect x="106" y="54" width="124" height="80" rx="10" fill="#cfe6cf"/><rect x="234" y="54" width="124" height="80" rx="10" fill="#f6dcc2"/><rect x="106" y="138" width="124" height="80" rx="10" fill="#f6dcc2"/><rect x="234" y="138" width="124" height="80" rx="10" fill="#e7e1d3"/></g>
<g font-size="11" fill="#2b1d14" text-anchor="middle">
<text x="168" y="88" font-weight="700">一致，證據最強</text><text x="168" y="106">這區確實重要</text>
<text x="296" y="78" font-weight="700">活動不等於必要</text><text x="296" y="94">策略、一般資源</text><text x="296" y="108">被抑制、病人太少</text>
<text x="168" y="160" font-weight="700">相減被抵消</text><text x="168" y="176">區域太小、個體差異</text><text x="168" y="190">或損傷的是經過的纖維</text>
<text x="296" y="182">兩邊都沒有</text></g>
<text x="200" y="244" font-size="11" fill="#6b5a4a" text-anchor="middle">課堂例子：動詞產生活化左下額葉；語意型失智症卻是左前顳葉</text>
</svg>
