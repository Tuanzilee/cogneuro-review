<g font-size="12" font-weight="700" fill="#2b1d14" text-anchor="middle"><text x="89" y="106">甲：Broca</text><text x="89" y="120" font-weight="400">區受損</text><text x="89" y="146">乙：Wernicke</text><text x="89" y="160" font-weight="400">區受損</text></g>
