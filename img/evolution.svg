<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" font-family="PingFang TC, Noto Sans TC, sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect width="400" height="260" rx="18" fill="#fffdf7"/>
<text x="200" y="22" font-size="14" font-weight="700" fill="#2b1d14" text-anchor="middle">大腦的演化：各物種的強項</text>
<g font-size="34" text-anchor="middle"><text x="42" y="82">🐟</text><text x="108" y="82">🐸</text><text x="174" y="82">🦎</text><text x="240" y="82">🐦</text><text x="306" y="82">🐭</text><text x="368" y="82">🧑</text></g>
