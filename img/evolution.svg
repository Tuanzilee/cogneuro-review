<g font-size="10" fill="#2b1d14" text-anchor="middle"><text x="42" y="144">平衡</text><text x="42" y="158">調節水壓</text><text x="108" y="144">嗅球</text><text x="108" y="158">嗅覺訊號</text><text x="174" y="144">前腦底部</text><text x="174" y="158">更多嗅覺核</text><text x="240" y="144">平衡</text><text x="240" y="158">飛行、定位</text><text x="306" y="144">情緒、記憶</text><text x="306" y="158">皮質有皺褶</text><text x="368" y="144">皮質更大</text><text x="368" y="158">皺褶更細</text></g>
<text x="366" y="172" font-size="10" fill="#2b1d14" text-anchor="middle">推理、決策</text><text x="366" y="186" font-size="10" fill="#2b1d14" text-anchor="middle">語言</text>
<text x="200" y="214" font-size="12" font-weight="700" fill="#c0504d" text-anchor="middle">人類 vs 其他哺乳類：差在皮質皺褶，不是邊緣系統或小腦</text>
<text x="200" y="236" font-size="10" fill="#6b5a4a" text-anchor="middle">不是把物種排高低，而是各腦區配合生存環境發展</text>
</svg>
