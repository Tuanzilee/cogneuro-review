<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" font-family="PingFang TC, Noto Sans TC, sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect width="400" height="260" rx="18" fill="#fffdf7"/><text x="200" y="22" font-size="14" font-weight="700" fill="#2b1d14" text-anchor="middle">單一個案研究 vs 團體研究</text>
<g stroke="#2b1d14" stroke-width="3"><rect x="14" y="36" width="178" height="206" rx="12" fill="#cfe0f0"/><rect x="208" y="36" width="178" height="206" rx="12" fill="#f6dcc2"/></g>
<circle cx="103" cy="84" r="24" fill="#f2b48a" stroke="#2b1d14" stroke-width="3"/>
<g fill="#f2b48a" stroke="#2b1d14" stroke-width="2"><circle cx="248" cy="78" r="8"/><circle cx="274" cy="92" r="8"/><circle cx="300" cy="76" r="8"/><circle cx="326" cy="92" r="8"/><circle cx="352" cy="78" r="8"/><circle cx="262" cy="106" r="8"/><circle cx="290" cy="112" r="8"/><circle cx="318" cy="108" r="8"/><circle cx="344" cy="110" r="8"/></g>
<g font-size="13" font-weight="700" fill="#2b1d14" text-anchor="middle"><text x="103" y="130">單一個案</text><text x="297" y="140">團體研究</text></g>
<g font-size="9" fill="#6b5a4a" text-anchor="middle"><text x="103" y="143">single-case</text><text x="297" y="153">group study</text></g>
<g font-size="11" fill="#2b1d14"><text x="24" y="166" font-weight="700" fill="#3f7a4f">＋ 看認知歷程怎麼拆分</text><text x="24" y="182" font-weight="700" fill="#3f7a4f">＋ 揭露平均掩蓋的結構</text><text x="24" y="206" font-weight="700" fill="#c0504d">－ 不能只靠一人建立理論</text><text x="24" y="222" font-weight="700" fill="#c0504d">－ 不能推到所有人</text>
<text x="218" y="176" font-weight="700" fill="#3f7a4f">＋ 找共同性</text><text x="218" y="192" font-size="10">依症狀、認知缺陷或病灶分組</text><text x="218" y="214" font-weight="700" fill="#c0504d">－ 忽略個別差異</text></g>
</svg>
