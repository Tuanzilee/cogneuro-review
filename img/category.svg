<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" font-family="PingFang TC, Noto Sans TC, sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect width="400" height="260" rx="18" fill="#fffdf7"/>
<text x="200" y="20" font-size="13" font-weight="700" fill="#2b1d14" text-anchor="middle">類別特異性：某些區域對某類刺激反應較強</text><rect x="14" y="34" width="112" height="112" rx="14" fill="#fffdf7" stroke="#2b1d14" stroke-width="2.5"/><text x="70" y="82" font-size="34" text-anchor="middle">🏠</text><text x="70" y="106" font-size="12" font-weight="700" fill="#2b1d14" text-anchor="middle">景象</text><text x="70" y="124" font-size="10" fill="#6b5a4a" text-anchor="middle">海馬旁景象區 PPA</text><rect x="144" y="34" width="112" height="112" rx="14" fill="#fffdf7" stroke="#2b1d14" stroke-width="2.5"/><text x="200" y="82" font-size="34" text-anchor="middle">🖐</text><text x="200" y="106" font-size="12" font-weight="700" fill="#2b1d14" text-anchor="middle">身體部位</text><text x="200" y="124" font-size="10" fill="#6b5a4a" text-anchor="middle">課堂舉例：手</text><rect x="274" y="34" width="112" height="112" rx="14" fill="#fffdf7" stroke="#2b1d14" stroke-width="2.5"/><text x="330" y="82" font-size="34" text-anchor="middle">🙂</text><text x="330" y="106" font-size="12" font-weight="700" fill="#2b1d14" text-anchor="middle">人臉</text><text x="330" y="124" font-size="10" fill="#6b5a4a" text-anchor="middle">梭狀回臉區 FFA（W3）</text><text x="200" y="170" font-size="11" font-weight="700" fill="#2b1d14" text-anchor="middle">大股東與小股東（課堂比喻）</text><rect x="30" y="180" width="230" height="22" rx="6" fill="#e8a3b6" stroke="#2b1d14" stroke-width="2.5"/><rect x="262" y="180" width="108" height="22" rx="6" fill="#f6dcc2" stroke="#2b1d14" stroke-width="2.5"/><text x="145" y="196" font-size="10" font-weight="700" fill="#2b1d14" text-anchor="middle">大股東：作用最大，受損最明顯</text><text x="316" y="196" font-size="10" fill="#2b1d14" text-anchor="middle">小股東：也有份</text><text x="200" y="228" font-size="11" fill="#2b1d14" text-anchor="middle">和定位論相容，但不代表一項功能只靠單一腦區</text><text x="200" y="246" font-size="10" fill="#6b5a4a" text-anchor="middle">現代也重視分散論：多個區域共同參與（呼應 W1）</text>
</svg>
