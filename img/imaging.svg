<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" font-family="PingFang TC, Noto Sans TC, sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect width="400" height="260" rx="18" fill="#fffdf7"/>
<text x="200" y="22" font-size="14" font-weight="700" fill="#2b1d14" text-anchor="middle">腦造影工具分兩類</text>
<g stroke="#2b1d14" stroke-width="3"><rect x="20" y="36" width="172" height="120" rx="12" fill="#cfe0f0"/><rect x="208" y="36" width="172" height="120" rx="12" fill="#f6dcc2"/></g>
<g font-size="14" font-weight="700" fill="#2b1d14" text-anchor="middle"><text x="106" y="58">結構影像</text><text x="294" y="58">功能影像</text></g>
<g font-size="10" fill="#6b5a4a" text-anchor="middle"><text x="106" y="72">structural：長什麼樣</text><text x="294" y="72">functional：在做什麼</text></g>
<g font-size="12" fill="#2b1d14" text-anchor="middle"><text x="106" y="98">X 光、CT</text><text x="106" y="118">MRI（T1）</text><text x="294" y="98">PET（代謝）</text><text x="294" y="118">fMRI（T2，BOLD）</text><text x="294" y="138">fNIRS（近紅外光）</text></g>
<g stroke="#2b1d14" stroke-width="2.5" fill="#fffdf7"><rect x="20" y="172" width="172" height="62" rx="10"/></g>
<g font-size="11" fill="#2b1d14" text-anchor="middle"><text x="106" y="192" font-weight="700">把結構連到功能</text><text x="106" y="210">VBM：比較灰質與白質</text><text x="106" y="226">DTI：看白質的連結</text></g>
<g stroke="#2b1d14" stroke-width="2.5" fill="#fffdf7"><rect x="208" y="172" width="172" height="62" rx="10"/></g>
<g font-size="11" fill="#2b1d14" text-anchor="middle"><text x="294" y="192" font-weight="700">T1：白質短、灰質長</text><text x="294" y="210">氫原子共振後回復快慢</text><text x="294" y="226">不同，形成對比</text></g>
</svg>
